<!doctype html>
<!--
  Scène des publicités MagyaPro — Restaurant et Boutique, 30 secondes.

  La sœur de `scene.html` (la vidéo du site), avec une autre mission : servir
  de matière à une publicité. Elle est donc plus dense, plus rapide, plus
  « tournée » — caméra qui avance, appareils en trois dimensions, lumière,
  grain de pellicule — et elle met en avant les fonctionnalités qui font
  vendre, plutôt qu'un seul parcours.

  Même moteur : rien ne bouge tout seul. `render(t)` place chaque élément à
  l'instant `t`, et `render.mjs --pub` photographie image par image. Aucun
  hasard non plus : les « aléas » (bokeh, grain) viennent d'un générateur à
  graine fixe, et l'image 412 est toujours l'image 412.

  ## Ce qui est montré

  Les écrans animés — panier qui se remplit, minuteurs de cuisine, stock qui
  baisse, passage hors ligne — sont **reconstruits** en HTML avec les
  couleurs, les polices et les libellés de l'application, pour pouvoir
  bouger. Ils ne montrent que des fonctionnalités qui existent, avec les
  produits et les prix des boutiques et restaurants de démonstration
  (Chez Aminata, Marché du Coin). Les libellés sont ceux de l'application :
  « Rupture dans », « À commander », « vente en attente de synchronisation ».

  Les vraies captures (`captures-pub/`) servent là où une image fixe suffit :
  la carte en ligne du client, qu'on fait défiler.

  `?produit=boutique` · `?format=vertical`
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0b1730;
    --bg-deep: #050b18;
    --accent: #ff5e2e;
    --accent-2: #ff9a4d;
    --glow: 255, 110, 60;
    --text: #fff;
    --muted: rgba(255,255,255,.7);
    /* L'application elle-même, pour les écrans reconstruits. */
    --app-bg: #ece5d8;
    --app-card: #fbf8f2;
    --app-border: #ddd3c1;
    --app-ink: #211d16;
    --app-muted: #6a6153;
    --app-faint: #9a9081;
    --app-side: #0b1730;
    --ok: #2f7d4f; --ok-soft: #dcefe2;
    --warn: #9a5a08; --warn-soft: #f8ead0;
    --bad: #b3261e; --bad-soft: #f6dcd8;
    --paper: #f7f8fa;
    --paper-ink: #18202f;
  }
  body.boutique {
    --bg: #1c1712;
    --bg-deep: #0d0a07;
    --accent: #e0bd52;
    --accent-2: #f0d47e;
    --glow: 224, 189, 82;
    --text: #f3ece1;
    --muted: rgba(243,236,225,.7);
    --app-side: #2a2119;
    --paper: #f0e3cd;
    --paper-ink: #3b2a1a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: var(--bg-deep); }
  body { position: relative; color: var(--text); -webkit-font-smoothing: antialiased; font-family: 'Manrope', sans-serif; }

  /* ------------------------------------------------------------ Le décor */
  .bg { position: absolute; inset: 0;
        background: radial-gradient(120% 90% at 70% 40%, var(--bg) 0%, var(--bg-deep) 75%); }
  .bokeh { position: absolute; inset: -10%; filter: blur(18px); }
  .bokeh i { position: absolute; border-radius: 50%;
             background: radial-gradient(circle, rgba(var(--glow), .55) 0%, rgba(var(--glow), .12) 55%, transparent 72%); }
  .dots { position: absolute; inset: 0; opacity: .5;
          background-image: radial-gradient(circle, rgba(255,255,255,.06) 1.4px, transparent 1.4px);
          background-size: 32px 32px; }
  .leak { position: absolute; inset: 0; mix-blend-mode: screen; pointer-events: none; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
              background: radial-gradient(130% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .07; mix-blend-mode: overlay; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }

  .cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .shot { position: absolute; inset: 0; display: none; }

  /* ------------------------------------------------------------ Légendes */
  .cap { position: absolute; left: 140px; top: 50%; width: 760px; translate: 0 -50%; }
  .cap .ln { display: block; overflow: hidden; padding: 0 0 .08em; margin-bottom: -.08em; white-space: nowrap; }
  .cap .w { display: inline-block; will-change: transform; }
  .cap .eyebrow { font: 500 20px/1 'DM Mono', monospace; letter-spacing: .28em; text-transform: uppercase;
                  color: var(--accent-2); margin-bottom: 30px; }
  .cap .big { font: 800 92px/0.98 'Bricolage Grotesque', sans-serif; letter-spacing: -0.035em; }
  .cap .mono { font: 500 54px/1.15 'DM Mono', monospace; letter-spacing: -0.01em; color: var(--accent-2); margin-top: 12px; }
  .cap .sub { font: 500 28px/1.4 'Manrope', sans-serif; color: var(--muted); margin-top: 30px; white-space: normal; }
  .cap .chip { display: inline-flex; align-items: center; gap: 12px; margin-top: 34px; padding: 14px 24px;
               border-radius: 999px; background: rgba(var(--glow), .14); border: 1px solid rgba(var(--glow), .4);
               font: 500 26px/1 'DM Mono', monospace; letter-spacing: .04em; color: var(--accent-2); }

  /* L'objet de chaque plan : centré sur son point, agrandi par `scale`
     (propriété distincte : l'animation écrit `transform`). */
  .obj { position: absolute; left: 1390px; top: 540px; translate: -50% -50%; transform-origin: 50% 50%; }
  .stage3d { perspective: 2200px; perspective-origin: 50% 40%; }

  /* -------------------------------------------------------- Téléphone */
  .phone { position: relative; width: 414px; height: 868px; padding: 12px; border-radius: 64px;
           background: linear-gradient(135deg, #5b5f66 0%, #2b2e33 18%, #1a1c20 50%, #2b2e33 82%, #6a6e75 100%);
           box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.18), inset 0 0 0 5px #0c0d0f,
                       0 60px 110px -40px rgba(0,0,0,.85), 0 25px 50px -25px rgba(0,0,0,.7);
           transform-style: preserve-3d; }
  .phone::before, .phone::after { content: ''; position: absolute; width: 5px; border-radius: 3px;
           background: linear-gradient(90deg, #2a2d31, #6a6e75); }
  .phone::before { left: -4px; top: 190px; height: 64px; box-shadow: 0 90px 0 #3a3d42; }
  .phone::after { right: -4px; top: 250px; height: 110px; }
  .screen { position: relative; width: 390px; height: 844px; border-radius: 52px; overflow: hidden; background: var(--app-bg); }
  .screen .status { position: absolute; left: 0; right: 0; top: 0; height: 52px; z-index: 6;
                    display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 40px;
                    font: 700 16px/1 'Manrope', sans-serif; color: var(--app-ink); }
  .screen .status .sig { display: flex; align-items: center; gap: 6px; }
  .screen .island { position: absolute; z-index: 7; left: 50%; top: 11px; width: 122px; height: 35px; margin-left: -61px;
                    border-radius: 999px; background: #000; }
  .screen .content { position: absolute; left: 0; right: 0; top: 52px; bottom: 0; overflow: hidden; }
  .glare { position: absolute; inset: 0; z-index: 8; pointer-events: none; border-radius: inherit;
           background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.16) 45%, transparent 60%);
           background-size: 300% 100%; }
  .finger { position: absolute; z-index: 9; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,.55) 0%, rgba(255,255,255,.25) 45%, rgba(255,255,255,0) 70%);
            border: 2px solid rgba(255,255,255,.75); box-shadow: 0 0 0 0 rgba(var(--glow),.5); display: none; }

  /* ---------------------------------------------------------- Tablette */
  .tablet { position: relative; padding: 22px; border-radius: 42px;
            background: linear-gradient(135deg, #4d5157 0%, #222428 20%, #16171a 55%, #2a2c30 85%, #5d6168 100%);
            box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.16), inset 0 0 0 7px #0b0c0e,
                        0 70px 120px -50px rgba(0,0,0,.9), 0 30px 60px -30px rgba(0,0,0,.7); }
  .tablet .tscreen { position: relative; width: 1180px; height: 740px; border-radius: 22px; overflow: hidden; background: var(--app-bg); }
  .tablet .cam-dot { position: absolute; left: 50%; top: 9px; width: 7px; height: 7px; margin-left: -3px; border-radius: 50%; background: #23262b; }

  /* -------------------------------------------- L'application, reconstruite */
  .app { position: absolute; inset: 0; display: flex; color: var(--app-ink); font: 500 16px/1.4 'Manrope', sans-serif; }
  .app .side { width: 220px; flex: none; background: var(--app-side); color: rgba(255,255,255,.82); padding: 22px 14px; }
  .app .logo { font: 700 22px/1 'Manrope', sans-serif; color: #fff; padding: 0 8px 18px; }
  .app .logo b { color: var(--accent); font-weight: 700; }
  body.boutique .app .logo b { color: #ff7a3d; }
  .app .side .store { border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); border-radius: 14px; padding: 12px; margin-bottom: 18px; font-size: 15px; color: #fff; }
  .app .side .store small { display: block; color: rgba(255,255,255,.5); font-size: 12px; margin-top: 2px; }
  .app .side .it { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; font-size: 15px; margin-bottom: 3px; }
  .app .side .it.on { background: linear-gradient(90deg, #ff5e2e, #ff8a3d); color: #fff; }
  .app .side .it i { width: 16px; height: 16px; border: 1.6px solid currentColor; border-radius: 4px; opacity: .8; }
  .app .main { flex: 1; padding: 26px 30px; overflow: hidden; position: relative; }
  .app h2 { margin: 0; font: 700 28px/1.1 'Manrope', sans-serif; letter-spacing: -.01em; }
  .app .lead { margin: 6px 0 18px; color: var(--app-muted); font-size: 15px; }
  .card { background: var(--app-card); border: 1px solid var(--app-border); border-radius: 18px;
          box-shadow: 0 1px 2px rgba(33,29,22,.05), 0 6px 16px -10px rgba(33,29,22,.18); }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; font-weight: 700;
         background: linear-gradient(90deg, #ff5e2e, #ff8a3d); color: #fff; padding: 12px 18px; font-size: 16px; }
  .btn.dark { background: var(--app-ink); }
  .btn.ghost { background: transparent; color: var(--app-ink); border: 1px solid var(--app-border); }
  .money { font-variant-numeric: tabular-nums; }

  /* Cuisine */
  .kb { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .kb .col h4 { margin: 0 0 10px; display: flex; justify-content: space-between; font: 700 16px/1 'Manrope'; }
  .kb .col h4 span { color: var(--app-faint); font-weight: 600; }
  .kb .lane { position: relative; height: 560px; border-radius: 16px; background: rgba(33,29,22,.035); border: 1px dashed rgba(33,29,22,.1); }
  .kcard { position: absolute; left: 10px; right: 10px; padding: 14px 16px; }
  .kcard .top { display: flex; justify-content: space-between; align-items: baseline; }
  .kcard .num { font: 700 24px/1 'Manrope'; }
  .kcard .kind { color: var(--app-faint); font-size: 13px; margin-top: 3px; }
  .kcard .lines { margin: 10px 0 12px; font-size: 15px; line-height: 1.5; }
  .kcard .act { width: 100%; padding: 10px; font-size: 15px; border-radius: 10px; }
  .wait { font: 600 13px/1 'DM Mono', monospace; padding: 5px 9px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); }
  .wait.late { background: var(--warn-soft); color: var(--warn); }

  /* Caisse */
  .pos { display: grid; grid-template-columns: 1fr 330px; gap: 18px; height: 100%; }
  .grid-p { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-content: start; }
  .tile { padding: 14px; position: relative; }
  .tile .nm { font: 700 15px/1.25 'Manrope'; min-height: 38px; }
  .tile .st { margin: 6px 0 10px; }
  .tile .ub { display: flex; gap: 6px; }
  .tile .ub span { flex: 1; text-align: center; padding: 8px 4px; border-radius: 9px; border: 1px solid var(--app-border); font-size: 12.5px; font-weight: 600; line-height: 1.25; }
  .tile .ub span b { display: block; font-size: 14px; }
  .cart { padding: 18px; display: flex; flex-direction: column; }
  .cart h4 { margin: 0 0 12px; font: 700 18px/1 'Manrope'; }
  .cline { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--app-border); font-size: 15px; }
  .cline small { display: block; color: var(--app-faint); font-size: 13px; }
  .pay { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
  .pay span { padding: 7px 11px; border-radius: 999px; border: 1px solid var(--app-border); font-size: 13px; font-weight: 600; }
  .pay span.on { background: var(--app-ink); color: #fff; border-color: var(--app-ink); }
  .total { display: flex; justify-content: space-between; align-items: baseline; margin-top: auto; padding-top: 12px; font: 700 18px/1 'Manrope'; }
  .total b { font: 800 30px/1 'Manrope'; letter-spacing: -.01em; }

  /* ------------------------------------------------------- Imprimante */
  .printer { position: relative; width: 560px; height: 330px; }
  .printer .body { position: absolute; left: 0; right: 0; bottom: 0; height: 250px; border-radius: 34px 34px 28px 28px;
                   background: linear-gradient(180deg, #34373c 0%, #1e2024 40%, #141518 100%);
                   box-shadow: inset 0 1.5px 0 rgba(255,255,255,.18), 0 50px 90px -30px rgba(0,0,0,.9); }
  .printer .lid { position: absolute; left: 30px; right: 30px; bottom: 150px; height: 70px; border-radius: 24px 24px 6px 6px;
                  background: linear-gradient(180deg, #44484e, #26282c); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
  .printer .slot { position: absolute; left: 90px; right: 90px; bottom: 214px; height: 10px; border-radius: 5px; background: #050506; }
  .printer .led { position: absolute; right: 60px; bottom: 60px; width: 12px; height: 12px; border-radius: 50%; background: #3dd68c; box-shadow: 0 0 14px #3dd68c; }
  .printer .brand { position: absolute; left: 56px; bottom: 54px; font: 500 15px/1 'DM Mono'; letter-spacing: .3em; color: rgba(255,255,255,.35); }
  .paperwrap { position: absolute; left: 105px; right: 105px; bottom: 219px; height: 900px; overflow: hidden; }
  .ticket { position: absolute; left: 0; right: 0; bottom: 0; padding: 34px 30px 40px; background: var(--paper); color: var(--paper-ink);
            font: 400 21px/1.65 'DM Mono', monospace;
            background-image: linear-gradient(180deg, rgba(0,0,0,.06), transparent 30px);
            -webkit-mask-image: radial-gradient(circle at 8px -1px, transparent 8px, black 8.5px);
            -webkit-mask-size: 16px 100%; -webkit-mask-repeat: repeat-x; -webkit-mask-position: top; }
  .ticket .hd { text-align: center; font-size: 17px; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; }
  .ticket .mt { text-align: center; font-size: 16px; opacity: .55; margin-top: 2px; }
  .ticket .r { display: flex; justify-content: space-between; gap: 14px; }
  .ticket .d { padding-left: 24px; font-size: 17px; opacity: .6; }
  .ticket .rule { margin: 14px 0; border-top: 2px dashed rgba(0,0,0,.18); }
  .ticket .tt { font-weight: 500; }
  .ticket .ft { text-align: center; font-size: 16px; letter-spacing: .28em; text-transform: uppercase; margin-top: 18px; }

  /* ----------------------------------------------------------- Bulles */
  .toast { position: absolute; display: flex; gap: 16px; align-items: center; width: 520px; padding: 20px 24px; border-radius: 24px;
           background: rgba(250,247,241,.94); color: var(--app-ink); box-shadow: 0 30px 70px -30px rgba(0,0,0,.8);
           backdrop-filter: blur(10px); font: 500 18px/1.35 'Manrope'; }
  .toast .ic { flex: none; width: 54px; height: 54px; border-radius: 15px; display: grid; place-items: center;
               background: linear-gradient(135deg, #ff5e2e, #ff9a4d); color: #fff; font: 800 26px/1 'Bricolage Grotesque'; }
  body.boutique .toast .ic { background: linear-gradient(135deg, #c99a2e, #e0bd52); color: #2a2119; }
  .toast b { display: block; font-size: 19px; }
  .toast small { color: var(--app-muted); font-size: 16px; }
  .toast .when { margin-left: auto; align-self: flex-start; color: var(--app-faint); font-size: 14px; }

  /* --------------------------------------------------- Plans « fonction » */
  .feat { position: relative; width: 760px; height: 560px; border-radius: 36px; overflow: hidden;
          background: linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.02));
          border: 1px solid rgba(255,255,255,.12); box-shadow: 0 60px 120px -50px rgba(0,0,0,.9); }
  .feat .k { position: absolute; left: 34px; top: 30px; font: 500 18px/1 'DM Mono'; letter-spacing: .26em; text-transform: uppercase; color: var(--accent-2); }
  .counter { position: absolute; right: 34px; top: 30px; font: 500 18px/1 'DM Mono'; color: var(--muted); letter-spacing: .1em; }

  .papers i { position: absolute; width: 230px; padding: 22px 20px; background: #f3ecdf; color: #3b2a1a;
              font: 400 19px/1.75 'DM Mono', monospace; box-shadow: 0 30px 50px -25px rgba(0,0,0,.8); border-top: 10px solid #c9603f; font-style: normal; }
  .papers i s { opacity: .55; }

  .end-logo { font: 800 64px/1 'Manrope', sans-serif; letter-spacing: -.02em; }
  .end-logo b { color: var(--accent); }
  body.boutique .end-logo b { color: var(--accent); }

  /* ---------------------------------------------- Composition verticale */
  body.vertical .cap { left: 90px; top: 150px; width: 900px; translate: 0 0; }
  body.vertical .cap .big { font-size: 86px; }
  body.vertical .cap .mono { font-size: 50px; }
  body.vertical .obj { left: 540px; top: 1260px; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="bokeh" id="bokeh"></div>
  <div class="dots"></div>
  <div class="leak" id="leak"></div>
  <div class="cam" id="cam"></div>
  <div class="vignette"></div>
  <div class="grain" id="grain"></div>
  <div class="flash" id="flash"></div>

<script>
  window.DURATION = 30;
  const Q = new URLSearchParams(location.search);
  const V = Q.get('format') === 'vertical';
  const PRODUCT = Q.get('produit') === 'boutique' ? 'boutique' : 'restaurant';
  if (V) document.body.classList.add('vertical');
  if (PRODUCT === 'boutique') document.body.classList.add('boutique');
  const W = V ? 1080 : 1920;

  // ------------------------------------------------------------- Outils
  const clamp = (x) => (Number.isNaN(x) ? 0 : Math.min(1, Math.max(0, x)));
  const span = (a, b, t) => clamp((t - a) / (b - a));
  const mix = (a, b, x) => a + (b - a) * x;
  /** Les courbes du produit : arrivée franche, départ qui accélère. */
  const arrive = (x) => 1 - Math.pow(1 - x, 5);
  const leave = (x) => x * x * x;
  const smooth = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  /** Un léger dépassement : un objet posé avec énergie, qui se cale. */
  const back = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  /** Générateur à graine fixe : le même film à chaque rendu. */
  function rng(seed) {
    return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r; return ((r ^ (r >>> 14)) >>> 0) / 4294967296; };
  }
  const fmt = (n) => Math.round(n).toLocaleString('fr-FR').replace(/ | /g, ' ');
  const el = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };
  const $ = (root, sel) => root.querySelector(sel);
  const $$ = (root, sel) => [...root.querySelectorAll(sel)];
  const css = (node, styles) => { if (node) Object.assign(node.style, styles); };
  /** Centre d'un élément dans l'écran de l'appareil, hors transformations. */
  function centerIn(node, root) {
    let x = node.offsetWidth / 2, y = node.offsetHeight / 2;
    for (let n = node; n && n !== root; n = n.offsetParent) { x += n.offsetLeft; y += n.offsetTop; }
    return { x, y };
  }

  // ------------------------------------------------------------- Décor
  const R = rng(PRODUCT === 'boutique' ? 7 : 3);
  const BOKEH = Array.from({ length: 16 }, () => ({
    x: R() * 110, y: R() * 110, s: 80 + R() * 260, d: 0.3 + R() * 0.9, o: 0.25 + R() * 0.6, p: R() * 6.28,
  }));
  const bokeh = document.getElementById('bokeh');
  for (const b of BOKEH) bokeh.appendChild(Object.assign(document.createElement('i'), { style: `width:${b.s}px;height:${b.s}px` }));

  // Grain : quatre trames de bruit tirées une fois, décalées à chaque image.
  const GRAIN = Array.from({ length: 4 }, (_, k) => {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d'); const img = g.createImageData(256, 256); const r = rng(100 + k);
    for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    g.putImageData(img, 0, 0); return c.toDataURL();
  });

  function decor(t) {
    $$(bokeh, 'i').forEach((node, i) => {
      const b = BOKEH[i];
      css(node, { left: `${b.x + Math.sin(t * 0.18 * b.d + b.p) * 3}%`, top: `${b.y + Math.cos(t * 0.14 * b.d + b.p) * 2.5 - t * 0.12 * b.d}%`,
                  opacity: String(b.o * (0.75 + 0.25 * Math.sin(t * 0.6 + b.p))) });
    });
    const f = Math.floor(t * 24); const r = rng(f + 1);
    css(document.getElementById('grain'), { backgroundImage: `url(${GRAIN[f % 4]})`, backgroundPosition: `${Math.floor(r() * 256)}px ${Math.floor(r() * 256)}px` });
    // Une fuite de lumière qui traverse lentement le cadre.
    const lx = 20 + 60 * ((t * 0.035) % 1);
    css(document.getElementById('leak'), { background: `radial-gradient(40% 55% at ${lx}% 15%, rgba(var(--glow), .16), transparent 70%)` });

  // ------------------------------------------------------------- Légendes
  /** Une légende : chaque mot monte de derrière sa ligne, à la suite. */
  function caption(lines) {
    const node = el(`<div class="cap"></div>`);
    for (const [cls, text] of lines) {
      const line = el(`<span class="ln ${cls}"></span>`);
      if (cls === 'chip') { line.innerHTML = `<span class="w">${text}</span>`; }
      else text.split(' ').forEach((word, i) => { line.insertAdjacentHTML('beforeend', `${i ? ' ' : ''}<span class="w">${word}</span>`); });
      node.appendChild(line);
    }
    return node;
  }
  function playCaption(node, lt, dur, delay = 0.15) {
    const words = $$(node, '.w');
    const exit = leave(span(dur - 0.45, dur - 0.05, lt));
    words.forEach((w, i) => {
      const e = arrive(span(delay + i * 0.045, delay + i * 0.045 + 0.65, lt));
      css(w, { transform: `translateY(${(1 - e) * 110}%)`, opacity: String(e) });
    });
    css(node, { transform: `translateY(${-exit * 40}px)`, opacity: String(1 - exit) });
  }

  // ------------------------------------------------------------- Appareils
  const SIGNAL = `<svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>`;
  const BATTERY = `<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2" fill="currentColor"/><rect x="24.5" y="4" width="2" height="5" rx="1" fill="currentColor" opacity=".4"/></svg>`;
  function phone(content, statusColor = 'var(--app-ink)') {
    return el(`<div class="phone"><div class="screen">
      <div class="status" style="color:${statusColor}"><span>20:14</span><span class="sig"><span class="net">${SIGNAL}</span>${BATTERY}</span></div>
      <div class="island"></div><div class="content">${content}</div>
      <div class="finger"></div><div class="glare"></div></div></div>`);
  }
  function tablet(content) {
    return el(`<div class="tablet"><div class="cam-dot"></div><div class="tscreen">${content}<div class="finger"></div><div class="glare"></div></div></div>`);
  }
  /** Un appareil qui entre en tournant légèrement sur lui-même, puis respire. */
  function device(node, lt, dur, { from = 30, tilt = -14, tiltX = 6 } = {}) {
    const e = arrive(span(0, 0.9, lt));
    const ry = mix(tilt + from * (V ? 0.4 : 1) * 0, tilt, e) + (1 - e) * from + Math.sin(lt * 0.9) * 2.2;
    const rx = tiltX * (1 - e * 0.4) + Math.cos(lt * 0.7) * 1.2;
    const y = (1 - e) * 220 + Math.sin(lt * 1.1) * 6;
    css(node, { transform: `translateY(${y}px) rotateY(${ry}deg) rotateX(${rx}deg)`, opacity: String(span(0, 0.3, lt)) });
    const glare = $(node, '.glare');
    css(glare, { backgroundPosition: `${mix(120, -40, (lt / dur))}% 0` });
  }
  function tap(finger, lt, at, x, y) {
    const p = span(at - 0.35, at + 0.45, lt);
    css(finger, { display: p > 0 && p < 1 ? 'block' : 'none', left: `${x}px`, top: `${y}px`,
                  transform: `scale(${p < 0.44 ? mix(1.4, 0.8, arrive(p / 0.44)) : mix(0.8, 1.9, (p - 0.44) / 0.56)})`,
                  opacity: String(p < 0.44 ? arrive(p / 0.44) : 1 - (p - 0.44) / 0.56),
                  boxShadow: `0 0 0 ${p > 0.44 ? (p - 0.44) * 60 : 0}px rgba(var(--glow), ${0.35 * (1 - p)})` });
    return lt >= at;
  }

  // ------------------------------------------------------------- Plans
  /** Le cadre de chaque plan : `a`, `b` en secondes, et ce qu'il fait. */
  const cam = document.getElementById('cam');
  const SHOTS = [];
  function shot(a, b, build, play, transition = 'whip') {
    const node = el('<div class="shot"></div>');
    cam.appendChild(node);
    const parts = build(node);
    SHOTS.push({ a, b, node, parts, play, transition });
  }
  function obj(node, inner, extra = '') {
    const wrap = el(`<div class="obj stage3d" style="${extra}"></div>`);
    wrap.appendChild(inner); node.appendChild(wrap); return wrap;
  }
  const OVER = 0.4; // chevauchement entre deux plans

  function transitions(t) {
    for (const s of SHOTS) {
      const visible = t >= s.a - OVER && t < s.b + OVER;
      s.node.style.display = visible ? 'block' : 'none';
      if (!visible) continue;
      const enter = span(s.a - OVER, s.a, t);
      const exit = span(s.b - 0.05, s.b + OVER, t);
      let tx = 0, blur = 0, op = 1, sc = 1;
      if (s.transition === 'whip') {
        tx = (1 - arrive(enter)) * W * 0.35 - leave(exit) * W * 0.35;
        blur = (1 - enter) * 26 * (enter > 0 ? 1 : 0) + exit * 26;
        op = (s.a === 0 ? 1 : smooth(enter)) * (1 - smooth(exit));
      } else {
        sc = mix(1.08, 1, arrive(enter)) * mix(1, 0.96, exit);
        op = (s.a === 0 ? 1 : smooth(enter)) * (1 - smooth(exit));
      }
      css(s.node, { transform: `translateX(${tx}px) scale(${sc})`, filter: blur > 0.3 ? `blur(${blur}px)` : 'none', opacity: String(op) });
      const lt = t - s.a;
      s.play(s.parts, lt, s.b - s.a, t);
    }
    // La caméra pousse doucement pendant tout le film : le cadre n'est jamais figé.
    css(cam, { transform: `scale(${1 + 0.03 * Math.sin(t * 0.21)})` });
  }

  /** Éclair blanc très bref : la coupe sèche entre l'accroche et la solution. */
  function flash(t, at) {
    const p = span(at - 0.05, at + 0.35, t);
    document.getElementById('flash').style.opacity = String(p > 0 && p < 1 ? 0.55 * (1 - p) : 0);
  }

  /** L'accroche : des bons de papier qui tombent, et la phrase qui frappe. */
  function hook(lines, papers) {
    shot(0, 3.4, (node) => {
      const pile = el('<div class="papers" style="position:absolute;inset:0"></div>');
      const r = rng(42);
      const items = papers.map((html, i) => {
        const p = el(`<i>${html}</i>`); pile.appendChild(p);
        return { p, x: (V ? 80 : 980) + r() * (V ? 700 : 760), y: (V ? 900 : 120) + r() * (V ? 700 : 520), rot: -18 + r() * 36, d: i * 0.18 };
      });
      node.appendChild(pile);
      const cap = caption(lines); node.appendChild(cap);
      return { items, cap };
    }, ({ items, cap }, lt, dur) => {
      playCaption(cap, lt, dur, 0.2);
      for (const it of items) {
        const e = back(span(it.d, it.d + 0.7, lt));
        const fall = Math.pow(span(2.5 + it.d * 0.2, 3.4, lt), 2);
        css(it.p, { left: `${it.x}px`, top: `${it.y}px`, opacity: String(span(it.d, it.d + 0.15, lt) * (1 - fall)),
                    transform: `translateY(${(1 - e) * -500 + fall * 900}px) rotate(${it.rot + (1 - e) * 40 + fall * 50}deg) scale(${mix(1.25, 1, e)})`,
                    filter: e < 0.6 || fall > 0.1 ? `blur(${(1 - e) * 6 + fall * 10}px)` : 'none' });
      }
    });
  }

  /** Une suite de fonctions, une par carte, comme on feuillette. */
  function montage(a, b, features) {
    const per = (b - a) / features.length;
    shot(a, b, (node) => {
      const cards = features.map((f, i) => {
        const cap = caption(f.caption); node.appendChild(cap);
        const card = el(`<div class="feat"><div class="k">${f.kicker}</div><div class="counter">0${i + 1} / 0${features.length}</div></div>`);
        const parts = f.build(card);
        const wrap = obj(node, card, V ? 'scale:1.25' : 'scale:1.1');
        return { f, cap, card, wrap, parts };
      });
      return { cards };
    }, ({ cards }, lt) => {
      cards.forEach((c, i) => {
        const s = i * per, local = lt - s;
        const on = local > -0.4 && local < per + 0.4;
        c.cap.style.display = c.wrap.style.display = on ? 'block' : 'none';
        if (!on) return;
        playCaption(c.cap, local, per + 0.05, 0.05);
        const e = arrive(span(-0.05, 0.55, local));
        const x = leave(span(per - 0.25, per + 0.15, local));
        css(c.wrap, { transform: `translateY(${(1 - e) * 160 - x * 160}px) rotateX(${(1 - e) * -18 + x * 18}deg) scale(${mix(0.9, 1, e)})`,
                      opacity: String(span(-0.05, 0.25, local) * (1 - x)), filter: x > 0.05 || e < 0.8 ? `blur(${(1 - e) * 8 + x * 14}px)` : 'none' });
        c.f.play(c.parts, local, per);
      });
    }, 'whip');
  }

      const chip = el(`<div class="cap" style="position:relative;left:auto;top:auto;translate:none;width:auto;scale:1.35;margin-top:18px"><span class="chip">${offer}</span></div>`);

  /** Un QR code dessiné à partir d'une graine — un motif, pas une adresse. */
  function qr(size, seed) {
    const n = 25, r = rng(seed), cell = size / n;
    let rects = '';
    const finder = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!finder(x, y) && r() > 0.52) rects += `<rect x="${x * cell}" y="${y * cell}" width="${cell}" height="${cell}"/>`;
    const f = (x, y) => `<rect x="${x * cell}" y="${y * cell}" width="${7 * cell}" height="${7 * cell}" fill="none" stroke="#18202f" stroke-width="${cell}" transform="translate(${cell / 2} ${cell / 2})" style="transform-box:fill-box"/><rect x="${(x + 2) * cell}" y="${(y + 2) * cell}" width="${3 * cell}" height="${3 * cell}"/>`;
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="#18202f">${rects}<g>${f(0, 0)}${f(n - 7, 0)}${f(0, n - 7)}</g></svg>`;
  }

      css(s.q, { opacity: String(span(2.0, 2.2, lt)), transform: `translateY(${(1 - back(span(2.0, 2.4, lt))) * 20}px)` });
      const synced = lt >= 3.5;
      s.qb.textContent = lt < 3.2 ? 'Hors ligne' : synced ? 'Synchronisée' : 'Envoi…';
      s.qb.className = `badge qb ${synced ? 'ok' : 'warn'}`;
      s.qt.textContent = synced ? 'La vente est arrivée sur le serveur.' : '1 vente en attente de synchronisation.';
    });

    // 4. Les ruptures à venir, d'après les ventes réelles.
    shot(14.2, 18.4, (node) => {
      const cap = caption([['eyebrow', 'Ruptures à venir'], ['big', 'La rupture'], ['big', 'annoncée avant,'], ['mono', 'd’après vos ventes.']]);
      node.appendChild(cap);
      const bars = [6, 9, 7, 11, 8, 12, 10, 14, 9, 13, 12, 15, 11, 16];
      const card = el(`<div class="card" style="width:720px;padding:30px 34px;color:#211d16">
        <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:24px">Eau minérale 1,5 L</b><span class="badge warn lvl">Stock normal</span></div>
        <div style="display:flex;align-items:flex-end;gap:8px;height:150px;margin:24px 0 8px">${bars.map((b) => `<div class="b" data-h="${b}" style="flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#e0bd52,#c99a2e);height:0"></div>`).join('')}</div>
        <div style="color:#9a9081;font-size:13px;display:flex;justify-content:space-between"><span>il y a 14 jours</span><span>aujourd’hui</span></div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px">
          ${[['Stock', '<span class="sk">36</span> bouteilles'], ['Ventes / jour', '12'], ['Rupture dans', '<span class="rd">—</span>'], ['À commander', '<span class="ac">—</span>']].map(([k, v]) => `<div style="padding:12px;border-radius:14px;background:#f3eee4"><div style="color:#6a6153;font-size:13px">${k}</div><div style="font:800 22px/1.2 Manrope;margin-top:4px">${v}</div></div>`).join('')}</div></div>`);
      const wrap = obj(node, card);
      return { cap, card, wrap, bars: $$(card, '.b'), lvl: $(card, '.lvl'), sk: $(card, '.sk'), rd: $(card, '.rd'), ac: $(card, '.ac') };
    }, (s, lt, dur) => {
      playCaption(s.cap, lt, dur);
      const e = arrive(span(0, 0.8, lt));
      css(s.card, { transform: `translateY(${(1 - e) * 160}px) rotateY(${V ? 0 : -14 + Math.sin(lt * 0.8) * 2}deg) rotateX(${6 * (1 - e) + 3}deg)`, opacity: String(span(0, 0.3, lt)) });
      css(s.wrap, { scale: V ? '1.32' : '1' });
      s.bars.forEach((b, i) => { b.style.height = `${(Number(b.dataset.h) / 16) * 150 * arrive(span(0.5 + i * 0.05, 1.0 + i * 0.05, lt))}px`; });
      const k = arrive(span(1.6, 2.6, lt));
      s.sk.textContent = String(Math.round(mix(36, 30, k)));
      const imminent = lt >= 2.4;
      s.rd.textContent = imminent ? '2 jours' : '3 jours';
      s.ac.textContent = lt >= 2.8 ? '4 cartons' : '—';
      s.lvl.textContent = imminent ? 'Rupture imminente' : 'Stock faible';
      s.lvl.className = `badge lvl ${imminent ? 'bad' : 'warn'}`;
      css(s.lvl, { transform: `scale(${lt > 2.4 && lt < 2.6 ? 1.12 : 1})` });
    });

    montage(18.4, 25.0, [
      { kicker: 'Commande vocale', caption: [['big', 'Dites-le,'], ['big', 'la caisse'], ['mono', 'remplit le panier.']],
        build: (card) => {
          const wave = el(`<div style="position:absolute;left:60px;right:60px;top:120px;height:140px;display:flex;align-items:center;gap:6px">${Array.from({ length: 48 }, () => '<i style="flex:1;border-radius:4px;background:var(--accent-2);height:10px"></i>').join('')}</div>`);
          const said = el(`<div style="position:absolute;left:60px;right:60px;top:280px;font:500 30px/1.3 DM Mono;color:#fff">« <span class="tx"></span> »</div>`);
          const items = el(`<div style="position:absolute;left:60px;right:60px;bottom:50px;display:flex;gap:12px">
            <div class="card vi" style="flex:1;padding:14px 16px;color:#211d16"><b>Eau minérale 1,5 L</b><div style="color:#6a6153">2 cartons de 12 · 10 800</div></div>
            <div class="card vi" style="flex:1;padding:14px 16px;color:#211d16"><b>Riz parfumé</b><div style="color:#6a6153">1 sac de 25 kg · 20 000</div></div></div>`);
          card.append(wave, said, items); return { bars: $$(wave, 'i'), tx: $(said, '.tx'), vi: $$(items, '.vi') };
        },
        play: (p, lt) => {
          const talking = lt > 0.1 && lt < 1.0;
          p.bars.forEach((b, i) => { const h = talking ? 14 + Math.abs(Math.sin(i * 0.7 + lt * 13) * Math.cos(i * 0.31 + lt * 5)) * 120 : 10; b.style.height = `${h}px`; });
          const full = 'deux cartons d’eau et un sac de riz';
          p.tx.textContent = full.slice(0, Math.round(full.length * span(0.1, 1.0, lt)));
          p.vi.forEach((v, i) => css(v, { opacity: String(span(1.05 + i * 0.12, 1.2 + i * 0.12, lt)), transform: `translateY(${(1 - back(span(1.05 + i * 0.12, 1.4 + i * 0.12, lt))) * 30}px)` }));
        } },
      { kicker: 'Clients & crédit', caption: [['big', 'Le crédit'], ['big', 'de chaque client,'], ['mono', 'au franc près.']],
        build: (card) => {
          const list = el(`<div class="card" style="position:absolute;left:60px;right:60px;top:100px;padding:10px 26px;color:#211d16;font-size:17px">
            ${[['Awa Diop', '6 achats ce mois', 12500], ['Moussa Ndiaye', '3 achats ce mois', 4500], ['Fatou Sall', '9 achats ce mois', 0]].map(([n, ph, d]) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px dashed #ddd3c1">
              <span><b>${n}</b><br><small style="color:#9a9081">${ph}</small></span><span class="badge ${d ? 'warn' : 'ok'} dv" data-d="${d}">${d ? 'Doit 0 F CFA' : 'À jour'}</span></div>`).join('')}</div>`);
          const pay = el(`<div class="toast" style="position:absolute;left:110px;bottom:40px;width:540px"><div class="ic">✓</div><div><b>Remboursement · Awa Diop</b><small>5 000 F CFA par Orange Money</small></div></div>`);
          card.append(list, pay); return { dv: $$(list, '.dv'), pay };
        },
        play: (p, lt) => {
          p.dv.forEach((d) => { const v = Number(d.dataset.d); if (!v) return; const k = arrive(span(0.1, 0.7, lt)); const paid = d === p.dv[0] && lt > 1.1 ? arrive(span(1.1, 1.5, lt)) * 5000 : 0; d.textContent = `Doit ${fmt(v * k - paid)} F CFA`; });
          css(p.pay, { opacity: String(span(0.9, 1.05, lt)), transform: `translateY(${(1 - back(span(0.9, 1.3, lt))) * 40}px)` });
        } },
      { kicker: 'Dates de péremption', caption: [['big', 'Rien ne périme'], ['big', 'en rayon'], ['mono', 'sans que vous'], ['mono', 'le sachiez.']],
        build: (card) => {
          const rows = el(`<div style="position:absolute;left:60px;right:60px;top:110px;display:grid;gap:12px">
            ${[['Yaourt nature', 'Lot du 14/09', 'Périme dans 3 jours', 'warn'], ['Lait en poudre 400 g', 'Lot du 02/08', 'Périmé', 'bad'], ['Jus de fruits 1 L', 'Lot du 20/09', 'Dans 6 mois', 'ok']].map(([n, l, s, k]) => `<div class="card pr" style="padding:18px 22px;color:#211d16;display:flex;justify-content:space-between;align-items:center"><span><b style="font-size:18px">${n}</b><br><small style="color:#9a9081">${l}</small></span><span class="badge ${k}">${s}</span></div>`).join('')}</div>`);
          card.append(rows); return { pr: $$(rows, '.pr') };
        },
        play: (p, lt) => { p.pr.forEach((r, i) => css(r, { opacity: String(span(0.1 + i * 0.18, 0.25 + i * 0.18, lt)), transform: `translateX(${(1 - back(span(0.1 + i * 0.18, 0.55 + i * 0.18, lt))) * -60}px)` })); } },
      { kicker: 'Plusieurs boutiques', caption: [['big', 'Toutes vos'], ['big', 'boutiques,'], ['mono', 'un seul écran.']],
        build: (card) => {
          const stores = el(`<div style="position:absolute;left:60px;right:60px;top:110px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px">
            ${[['Marché du Coin', 'Dakar Plateau', 184500], ['Marché du Coin 2', 'Parcelles', 126300], ['Dépôt', 'Pikine', 98700]].map(([n, c, v]) => `<div class="card sc" style="padding:18px;color:#211d16"><b style="font-size:17px">${n}</b><div style="color:#9a9081;font-size:13px">${c}</div><div style="color:#6a6153;font-size:13px;margin-top:18px">Aujourd’hui</div><div class="v" data-v="${v}" style="font:800 22px/1.2 Manrope">0</div></div>`).join('')}</div>`);
          const sum = el(`<div style="position:absolute;left:60px;right:60px;bottom:60px;display:flex;justify-content:space-between;align-items:baseline;color:#fff"><span style="font:500 20px/1 DM Mono;letter-spacing:.14em;color:var(--muted)">TOTAL DU JOUR</span><b class="s" style="font:800 54px/1 Bricolage Grotesque;color:var(--accent-2)">0</b></div>`);
          card.append(stores, sum); return { sc: $$(stores, '.sc'), v: $$(stores, '.v'), s: $(sum, '.s') };
        },
        play: (p, lt) => {
          const k = arrive(span(0.3, 1.2, lt));
          p.sc.forEach((c, i) => css(c, { opacity: String(span(0.05 + i * 0.1, 0.2 + i * 0.1, lt)), transform: `translateY(${(1 - back(span(0.05 + i * 0.1, 0.5 + i * 0.1, lt))) * 40}px)` }));
          let tot = 0; p.v.forEach((v) => { const x = Number(v.dataset.v) * k; tot += x; v.textContent = `${fmt(x)} F`; });
          p.s.textContent = `${fmt(tot)} F CFA`;
        } },
    ]);

    endCard(25.0, [['big', 'Vendez au carton'], ['big', 'comme à l’unité.'], ['mono', 'Même sans réseau.']], 'Un mois gratuit · sans carte bancaire');
  }

  if (PRODUCT === 'boutique') boutique(); else restaurant();

  window.render = (t) => {
    decor(t);
    transitions(t);
    flash(t, 3.4);
  };

  /** Les captures que la scène attend, chargées par le moteur de rendu. */
  window.CAPTURES = [...document.querySelectorAll('img[data-capture]')].map((img) => img.dataset.capture);
</script>
</body>
</html>
