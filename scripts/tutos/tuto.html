<!doctype html>
<!--
  Tutoriels vidéo MagyaPro — le moteur commun de la série.

  `?tuto=<id>` charge `<id>.js` : les écrans reconstruits, les gestes et
  l'habillage d'un tutoriel (`window.TUTO`). Ce fichier-ci porte la mise en
  scène, identique d'une vidéo à l'autre.

  Rien ne bouge tout seul : `render(t)` place chaque élément à l'instant t et
  `render-tuto.mjs` photographie image par image, sur un minutage dicté par
  la voix (`configure`).

  ## Comment la vidéo explique

  Un tutoriel réussi se comprend **sans le son** et **sans relire**. Chaque
  choix ci-dessous sert l'un des deux :

  - **Le problème d'abord** : un bon papier griffonné se froisse et tombe.
    On montre ce que le logiciel remplace avant de montrer le logiciel.
  - **La feuille de route, toujours visible** : les quatre étapes en
    pastilles en haut de l'image. L'étape en cours s'allume, les étapes
    faites se cochent : on sait à tout moment où l'on en est, et combien il
    en reste.
  - **Un seul geste à la fois, montré trois fois** : le projecteur assombrit
    tout sauf l'élément à toucher, une bulle dit ce qu'on fait (« Touchez
    “Nouvelle commande” »), et le doigt touche. L'œil n'a jamais à chercher.
  - **Le téléphone au premier plan** — c'est l'écran du public, sur TikTok
    comme au comptoir — et l'ordinateur au-dessus, en gros plan sur la zone
    où l'on agit, qui fait la même chose au même moment.
  - **Les mots s'allument quand ils sont dits** (sous-titres « karaoké ») :
    on suit sans le son, et le son aide qui lit mal.
  - **Le récapitulatif** : la liste des quatre étapes se coche au rythme de
    la voix. Ce qu'on retient, c'est elle.
  - **Le son** : un clic à chaque toucher, un souffle à chaque étape, un
    carillon quand la commande part (`window.CUES`, posés par le moteur).

  Les écrans sont reconstruits d'après l'application (libellés, couleurs,
  ordre des champs de `new-order-form.tsx`), avec la carte du restaurant de
  démonstration « Chez Aminata ».

  `?format=vertical` (9:16 : TikTok, Reels, Shorts) — sinon 16:9 (YouTube).
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<script>
  // Le tutoriel à jouer : `?tuto=comptoir` charge `comptoir.js`.
  document.write(`<script src="${new URLSearchParams(location.search).get('tuto') || 'comptoir'}.js"><\/script>`);
</script>
<style>
  :root {
    --bg: #0b1730; --bg-deep: #050b18; --accent: #ff5e2e; --accent-2: #ff9a4d;
    --text: #fff; --muted: rgba(255,255,255,.72); --done: #3dd68c;
    --app-bg: #ece5d8; --card: #fbf8f2; --raised: #fff; --border: #ddd3c1;
    --ink: #211d16; --ink-muted: #6a6153; --ink-faint: #948b7b; --side: #0c1730;

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: var(--bg-deep); }

  /* ------------------------------------------------- Feuille de route */
  .head { position: absolute; left: 0; right: 0; top: 64px; text-align: center; padding: 0 40px; }
  .brand { font: 700 28px/1 'Manrope'; letter-spacing: -.01em; opacity: .85; }
  .brand b { color: var(--accent); font-weight: 700; }
  .road { display: flex; justify-content: center; gap: 10px; margin-top: 26px; }
  .pill { display: flex; align-items: center; gap: 10px; padding: 9px 16px 9px 9px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,.22);
          font: 600 22px/1 'Manrope'; color: rgba(255,255,255,.6); background: rgba(255,255,255,.04); transform-origin: 50% 50%; }
  .pill .n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 19px/1 'DM Mono'; background: rgba(255,255,255,.12); color: #fff; }
  .pill.on { border-color: var(--accent); background: linear-gradient(90deg, rgba(255,154,77,.25), rgba(255,94,46,.25)); color: #fff; }
  .pill.on .n { background: var(--accent); }
  .pill.done { border-color: rgba(61,214,140,.55); color: rgba(255,255,255,.85); }
  .pill.done .n { background: var(--done); color: #0c2a1b; }
  .title { margin-top: 22px; font: 800 56px/1.04 'Bricolage Grotesque', sans-serif; letter-spacing: -.035em; text-wrap: balance; }

  /* -------------------------------------------------------- Sous-titres */
  .subs { position: absolute; left: 36px; right: 36px; bottom: 30px; text-align: center; }
  .subs span.box { display: inline; padding: 8px 16px; border-radius: 12px; -webkit-box-decoration-break: clone; box-decoration-break: clone;
                   background: rgba(5,11,24,.86); font: 700 40px/1.7 'Manrope'; }
  .subs .w { color: rgba(255,255,255,.42); }
  .subs .w.said { color: #fff; }
  .subs .w.now { color: var(--accent-2); }

  /* ---------------------------------------------------------- Appareils */
  .laptop { position: absolute; width: 996px; transform-origin: 0 0; }
  .laptop .lid { padding: 18px 18px 22px; border-radius: 26px 26px 6px 6px; background: linear-gradient(180deg, #3a3e45, #1b1d21);
                 box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14), 0 40px 90px -30px rgba(0,0,0,.9); }
  .laptop .lscreen { position: relative; width: 960px; height: 600px; overflow: hidden; border-radius: 6px; background: var(--app-bg); }
  .laptop .base { height: 22px; margin: 0 -40px; border-radius: 0 0 22px 22px; background: linear-gradient(180deg, #c9ccd1, #8c9097); box-shadow: 0 30px 50px -25px rgba(0,0,0,.9); }
  .laptop .base::before { content: ''; display: block; width: 160px; height: 8px; margin: 0 auto; border-radius: 0 0 10px 10px; background: #6d7178; }
  .desk { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; }

  .phone { position: absolute; width: 414px; height: 868px; padding: 12px; border-radius: 64px; transform-origin: 0 0;
           background: linear-gradient(135deg, #5b5f66 0%, #2b2e33 18%, #1a1c20 50%, #2b2e33 82%, #6a6e75 100%);
           box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.18), inset 0 0 0 5px #0c0d0f, 0 60px 120px -40px rgba(0,0,0,.95); }
  .phone .pscreen { position: relative; width: 390px; height: 844px; border-radius: 52px; overflow: hidden; background: var(--app-bg); }
  .phone .status { position: absolute; left: 0; right: 0; top: 0; height: 50px; z-index: 30; display: flex; justify-content: space-between; align-items: center;
                   padding: 6px 34px 0 40px; font: 700 16px/1 'Manrope'; color: var(--ink); background: var(--card); }
  .phone .island { position: absolute; z-index: 31; left: 50%; top: 11px; width: 122px; height: 35px; margin-left: -61px; border-radius: 99px; background: #000; }
  .mob { position: absolute; left: 0; right: 0; top: 50px; bottom: 0; overflow: hidden; color: var(--ink); font: 500 15px/1.4 'Manrope'; }
  .mob h1 { margin: 0; font: 600 26px/1.15 'Bricolage Grotesque'; letter-spacing: -.02em; }
  .mob .lead { margin: 4px 0 16px; color: var(--ink-muted); font-size: 14.5px; }
  .devlabel { position: absolute; padding: 7px 14px; border-radius: 99px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
              font: 500 17px/1 'DM Mono'; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

  /* ------------------------------------------------------ L'application */
  .app { position: absolute; inset: 0; display: flex; color: var(--ink); font: 500 15px/1.4 'Manrope'; }
  .side { width: 232px; flex: none; background: var(--side); color: rgba(255,255,255,.62); padding: 22px 14px; }
  .side .logo { font: 700 22px/1 'Manrope'; color: #fff; padding: 0 8px 18px; } .side .logo b { color: var(--accent); }
  .side .resto { border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); border-radius: 14px; padding: 12px; margin-bottom: 20px; color: #fff; font-size: 15px; }
  .side .resto small { display: block; color: rgba(255,255,255,.5); font-size: 12px; margin-top: 2px; }
  .side h6 { margin: 0 10px 8px; font: 500 11px/1 'Manrope'; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.35); }
  .nav { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; font-size: 15px; margin-bottom: 2px; }
  .nav i { width: 16px; height: 16px; border: 1.6px solid currentColor; border-radius: 4px; opacity: .8; }
  .nav.on { background: linear-gradient(90deg, #ff9a4d, #ff5e2e); color: #fff; }
  .main { flex: 1; padding: 28px 32px; position: relative; overflow: hidden; }
  .main h1 { margin: 0; font: 600 28px/1.15 'Bricolage Grotesque'; letter-spacing: -.02em; }
  .main .lead { margin: 4px 0 20px; color: var(--ink-muted); font-size: 15px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 1px 2px rgba(33,29,22,.06), 0 6px 16px -10px rgba(33,29,22,.18); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 14px; font-weight: 600; font-size: 15px;
         background: var(--accent); color: #fff; box-shadow: 0 4px 12px -4px rgba(255,94,46,.5); }
  .btn.sec { background: var(--card); color: var(--ink); border: 1px solid var(--border); box-shadow: none; }
  .btn.ghost { background: transparent; color: var(--ink-muted); box-shadow: none; }
  .btn.wide { width: 100%; height: 50px; font-size: 16px; }
  .btn.off { opacity: .45; }
  .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600; }
  .badge.b { background: #fff1e6; color: var(--accent); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .input { height: 44px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); padding: 0 14px; display: flex; align-items: center; font-size: 15px; color: var(--ink); }
  .input.ph { color: var(--ink-faint); }
  .input.focus { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .caret { display: inline-block; width: 2px; height: 18px; margin-left: 1px; background: var(--ink); vertical-align: middle; }
  .label { font-size: 13.5px; font-weight: 600; margin: 12px 0 6px; }
  .label .req { color: #c0392b; }
  .seg { display: flex; gap: 6px; padding: 4px; border-radius: 14px; background: var(--app-bg); }
  .seg span { flex: 1; text-align: center; padding: 9px 4px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--ink-muted); }
  .seg span.on { background: var(--ink); color: #fff; }

  .dishes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .dish { overflow: hidden; border-radius: 14px; border: 1px solid var(--border); background: var(--raised); }
  .dish.open { border-color: var(--ink); }
  .dish .top { display: flex; justify-content: space-between; gap: 8px; padding: 12px 14px; }
  .dish .nm { font-weight: 600; font-size: 15px; }
  .dish .cat { color: var(--ink-faint); font-size: 12.5px; margin-top: 2px; }
  .dish .pr { margin-top: 8px; font-size: 15px; font-variant-numeric: tabular-nums; }
  .dish .opts { border-top: 1px solid var(--border); background: var(--app-bg); padding: 10px 14px; }
  .dish .opt { display: flex; align-items: center; gap: 8px; min-height: 34px; font-size: 13.5px; }
  .dish .opt > span:nth-child(2) { min-width: 0; line-height: 1.25; }
  .dish .opt > span:nth-child(3) { white-space: nowrap; font-size: 12.5px; }
  .box { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--ink-faint); flex: none; display: grid; place-items: center; }
  .box.on { background: var(--ink); border-color: var(--ink); }
  .box.on::after { content: ''; width: 9px; height: 5px; border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff; transform: translateY(-1px) rotate(-45deg); }

  .lines .ln { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--border); font-size: 14.5px; }
  .lines .ln small { display: block; color: var(--ink-faint); font-size: 12.5px; }
  .qty { display: flex; align-items: center; gap: 6px; }
  .qty span { width: 28px; height: 28px; border-radius: 9px; border: 1px solid var(--border); display: grid; place-items: center; font-size: 16px; }
  .qty b { min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; }

  .toast { position: absolute; z-index: 40; display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 16px; background: var(--ink); color: #fff; font-size: 15px; font-weight: 600;
           box-shadow: 0 20px 40px -15px rgba(0,0,0,.6); }
  .toast .ic { width: 26px; height: 26px; border-radius: 50%; background: #3dd68c; display: grid; place-items: center; color: #10301f; font-weight: 800; }

  .kcol h4 { margin: 0 0 10px; display: flex; justify-content: space-between; font-size: 15px; }
  .kcol h4 span { color: var(--ink-faint); }
  .kcard { padding: 14px 16px; margin-bottom: 12px; }
  .kcard .num { font: 700 24px/1 'Manrope'; }
  .wait { font: 600 13px/1 'DM Mono'; padding: 5px 9px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); }



  /* ---------------------------------------------- Projecteur et gestes */
  /* Le projecteur vit dans l'écran de l'appareil (qui le rogne) : tout
     s'assombrit sauf l'élément à toucher, cerclé d'orange. */
  .spot { position: absolute; z-index: 60; pointer-events: none; border-radius: 14px; border: 3px solid var(--accent);
          box-shadow: 0 0 0 4000px rgba(10,8,6,.5), 0 0 0 8px rgba(255,94,46,.25); }
  .cursor { position: absolute; z-index: 80; width: 34px; height: 34px; pointer-events: none; filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
  .finger { position: absolute; z-index: 80; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; pointer-events: none;
            background: radial-gradient(circle, rgba(255,255,255,.7) 0%, rgba(255,255,255,.3) 50%, rgba(255,255,255,0) 72%); border: 3px solid #fff;
            box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .ripple { position: absolute; z-index: 79; pointer-events: none; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 4px solid var(--accent); }
  /* La consigne du geste, en bulle, au-dessus de ce qu'on touche. */
  .tip { position: absolute; z-index: 90; display: flex; align-items: center; gap: 12px; padding: 14px 20px 14px 14px; border-radius: 18px; white-space: nowrap;
         background: #fff; color: var(--ink); font: 700 30px/1.1 'Manrope'; box-shadow: 0 20px 40px -12px rgba(0,0,0,.55); transform-origin: 50% 100%; }
  .tip .n { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; font: 700 20px/1 'DM Mono'; flex: none; }
  .tip::after { content: ''; position: absolute; left: var(--arrow, 50%); bottom: -11px; width: 22px; height: 22px; margin-left: -11px; background: #fff; transform: rotate(45deg); border-radius: 3px; }
  .tip.below { transform-origin: 50% 0; }
  .tip.below::after { bottom: auto; top: -11px; }

  /* -------------------------------------------------- Numéro d'étape */
  .bignum { position: absolute; z-index: 70; left: 0; right: 0; top: 50%; text-align: center; pointer-events: none; }
  .bignum b { display: block; font: 800 420px/0.8 'Bricolage Grotesque'; letter-spacing: -.06em; color: var(--accent);
              text-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .bignum span { display: block; margin-top: 10px; font: 600 40px/1 'DM Mono'; letter-spacing: .3em; text-transform: uppercase; color: #fff; }
  .dim { position: absolute; inset: 0; z-index: 65; background: rgba(5,11,24,.78); pointer-events: none; }

  /* ---------------------------------------------------------- Accroche */
  .hook { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
  .slip { position: absolute; width: 420px; padding: 34px 32px 40px; background: #f6efe0; color: #2c2416; border-radius: 4px;
          font: 400 34px/1.55 'DM Mono'; box-shadow: 0 40px 80px -30px rgba(0,0,0,.9); border-top: 14px solid #c9603f; }
  .slip s { opacity: .55; }
  .ring-ico { position: absolute; width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); }
  .ring-ico i { position: absolute; inset: 0; border-radius: 50%; border: 4px solid var(--accent); }
  .lost { position: absolute; left: 0; right: 0; text-align: center; font: 800 96px/1 'Bricolage Grotesque'; letter-spacing: -.04em; }
  .lost em { font-style: normal; color: var(--accent-2); }

  /* ------------------------------------------------------ Récapitulatif */
  .recap { position: absolute; z-index: 75; left: 50%; top: 50%; width: 760px; padding: 44px 48px; border-radius: 36px; background: rgba(251,248,242,.97); color: var(--ink);
           box-shadow: 0 50px 120px -30px rgba(0,0,0,.9); }
  .recap h3 { margin: 0 0 24px; font: 800 52px/1 'Bricolage Grotesque'; letter-spacing: -.03em; }
  .recap .it { display: flex; align-items: center; gap: 20px; padding: 18px 0; border-top: 1.5px dashed var(--border); font: 700 36px/1.1 'Manrope'; }
  .recap .ck { width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--border); display: grid; place-items: center; flex: none; font: 700 26px/1 'DM Mono'; color: var(--ink-faint); }
  .recap .ck.on { background: var(--done); border-color: var(--done); color: #0c2a1b; }
  .recap .it small { display: block; margin-top: 6px; font: 500 22px/1.2 'Manrope'; color: var(--ink-muted); }

  .endcard { position: absolute; inset: 0; z-index: 85; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 70px; }
  .endcard .lg { font: 800 100px/1 'Manrope'; letter-spacing: -.03em; } .endcard .lg b { color: var(--accent); }
  .endcard .tg { margin-top: 34px; font: 800 66px/1.05 'Bricolage Grotesque'; letter-spacing: -.03em; text-wrap: balance; }
  .endcard .of { margin-top: 46px; padding: 20px 34px; border-radius: 99px; background: var(--accent); color: #fff; font: 700 34px/1 'Manrope'; box-shadow: 0 20px 50px -15px rgba(255,94,46,.7); }
  .endcard .sm { margin-top: 22px; font: 500 26px/1 'DM Mono'; color: var(--muted); letter-spacing: .06em; }

  /* 16:9 */
  body:not(.vertical) .head { top: 34px; }
  body:not(.vertical) .title { font-size: 46px; margin-top: 16px; }
  body:not(.vertical) .road { margin-top: 18px; }
  body:not(.vertical) .pill { font-size: 19px; padding: 7px 14px 7px 7px; }
  body:not(.vertical) .pill .n { width: 30px; height: 30px; font-size: 17px; }
  body:not(.vertical) .subs { bottom: 26px; }
  body:not(.vertical) .subs span.box { font-size: 32px; }
  body:not(.vertical) .bignum b { font-size: 320px; }
</style>
</head>
<body>
  <div class="bg"></div><div class="dots"></div>
  <div class="glow" id="glow1"></div><div class="glow" id="glow2"></div>

  <div class="hook" id="hook">
    <div class="ring-ico" id="hook-ring"><i></i><i></i><svg width="70" height="70" viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></div>

  <div class="laptop" id="laptop"><div class="lid"><div class="lscreen" id="lscreen"><div class="desk" id="desk"></div><div class="spot" id="spot-d"></div></div></div><div class="base"></div></div>

    <div class="status"><span>12:30</span><span>●●● ▮</span></div><div class="island"></div>

  <div class="bignum" id="bignum"><b id="bignum-b"></b><span>Étape</span></div>

  <div class="recap" id="recap"><h3>En résumé</h3><div id="recap-items"></div></div>

  <div class="endcard" id="end"><div class="lg">Magya<b>pro</b></div><div class="tg" id="tagline"></div><div class="of">Essai gratuit · 1 mois</div><div class="sm">sans carte bancaire</div></div>

  <div class="subs" id="subs"></div>

<script>
  const Q = new URLSearchParams(location.search);
  const V = Q.get('format') === 'vertical';
  if (V) document.body.classList.add('vertical');

  // ------------------------------------------------------------ Outils
  const clamp = (x) => (Number.isNaN(x) ? 0 : Math.min(1, Math.max(0, x)));
  const span = (a, b, t) => clamp((t - a) / (b - a));
  const mix = (a, b, x) => a + (b - a) * x;
  const arrive = (x) => 1 - Math.pow(1 - x, 4);
  const leave = (x) => x * x * x;
  const smooth = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const back = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const fmt = (n) => `${String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ')} F CFA`;
  const $ = (id) => document.getElementById(id);
  const css = (el, s) => el && Object.assign(el.style, s);

  // ------------------------------------------------------------ Mise en page
  /** Positions des appareils ; le téléphone, au premier plan, est le plus grand. */
  const L = V
    ? { laptop: { x: 141, y: 352, s: 0.80 }, phone: { x: 333, y: 846, s: 1.0 }, lblpc: { x: -999, y: 0 }, lbltel: { x: -999, y: 0 } }
    : { laptop: { x: 90, y: 240, s: 1.0 }, phone: { x: 1250, y: 240, s: 0.86 }, lblpc: { x: 90, y: 200 }, lbltel: { x: 1290, y: 200 } };
  css($('lbl-pc'), { left: `${L.lblpc.x}px`, top: `${L.lblpc.y}px` });
  css($('lbl-tel'), { left: `${L.lbltel.x}px`, top: `${L.lbltel.y}px` });
  css($('glow1'), { width: '760px', height: '760px', left: '-240px', top: V ? '560px' : '120px' });
  css($('glow2'), { width: '640px', height: '640px', right: '-180px', bottom: V ? '160px' : '-120px', left: 'auto' });
  css($('hook-ring'), V ? { left: '465px', top: '330px' } : { left: '885px', top: '170px' });
  css($('slip'), V ? { left: '330px', top: '620px' } : { left: '750px', top: '360px' });
  css($('lost'), { top: V ? '1360px' : '880px', fontSize: V ? '96px' : '72px' });

  // ------------------------------------------------------------ Le script
  let SEG = [];
  let EVENTS = [];
  const GAP = 0.4;
  window.configure = (segments) => {
    let t = 0.4;
    SEG = segments.map((s) => {
      // Un temps de respiration avant chaque nouvelle étape, pour le chiffre.
      if (s.etape && !segments.slice(0, segments.indexOf(s)).some((x) => x.etape === s.etape)) t += 0.5;
      const out = { ...s, start: t, end: t + s.duree };
      t = out.end + GAP;
      return out;
    });
    window.DURATION = t + 2.4;
    build();
    window.CUES = cues();
  };
  const seg = (id) => SEG.find((s) => s.id === id);
  const at = (id, f) => { const s = seg(id); return s.start + (s.end - s.start) * f; };
  /** Début d'une nouvelle étape : c'est là que passe le grand chiffre. */
  const stepStarts = () => SEG.filter((s, i) => s.etape && !SEG.slice(0, i).some((x) => x.etape === s.etape));

  // Habillage propre au tutoriel (voir `<tuto>.js`).
  $('brand').innerHTML = `Magya<b>pro</b> ${TUTO.produit}`;
  $('road').innerHTML = TUTO.road.map(([n, l]) => `<div class="pill" data-step="${n}"><span class="n">${n}</span>${l}</div>`).join('');
  $('recap-items').innerHTML = TUTO.recap.map(([a, b], i) => `<div class="it"><span class="ck" data-ck="${i}">${i + 1}</span><span>${a}<small>${b}</small></span></div>`).join('');
  $('slip').innerHTML = TUTO.hook.slip;
  $('lost').innerHTML = TUTO.hook.lost;
  $('tagline').textContent = TUTO.tagline;
  if (!TUTO.hook.ring) $('hook-ring').style.display = 'none';
  // Ce que montre chaque appareil (par défaut : le même écran, des deux côtés).
  $('lbl-pc').textContent = TUTO.labels?.pc ?? 'Sur ordinateur';
  $('lbl-tel').textContent = TUTO.labels?.tel ?? 'Sur téléphone';
  // En vertical, l'étiquette du téléphone n'apparaît que si elle dit autre
  // chose que « le même écran » — à gauche du téléphone.
  if (V && TUTO.labels?.tel) { L.lbltel = { x: 36, y: 1040 }; css($('lbl-tel'), { left: '36px', top: '1040px', whiteSpace: 'normal', width: '270px', lineHeight: '1.4' }); }
  if (TUTO.theme) for (const [k, v] of Object.entries(TUTO.theme)) document.documentElement.style.setProperty(k, v);
  if (TUTO.css) document.head.insertAdjacentHTML('beforeend', `<style>${TUTO.css}</style>`);

  // L'état de l'application : celui du tutoriel, rejoué geste par geste.
  function stateAt(t) {
    const s = TUTO.initState();
    for (const ev of EVENTS) {
      if (ev.t > t) break;
      ev.fn(s);
      if (ev.type) {
        const n = Math.round(ev.type.text.length * span(ev.t + 0.25, ev.t + 0.25 + ev.type.dur, t));
        s[ev.type.field] = ev.type.text.slice(0, n);
      }
    }
    return s;
  }
  function build() {
    EVENTS = TUTO.events(at).sort((x, y) => x.t - y.t);
  }

  /** Les sons, pour le moteur : un clic par toucher, un souffle par étape, un carillon à l'envoi. */
  function cues() {
    const out = [];
    // Un « regard » (`look`) montre sans toucher : pas de clic.
    for (const e of EVENTS) if ((e.d || e.m) && !e.look) out.push({ t: e.t, type: e.chime ? 'carillon' : 'clic' });
    for (const s of stepStarts()) out.push({ t: s.start - 0.55, type: 'souffle' });
    const p = seg('probleme');
    if (p) out.push({ t: at('probleme', 0.72), type: 'froisse' });
    const r = seg('recap');
    if (r) TUTO.recapAt.forEach((f) => out.push({ t: at('recap', f), type: 'coche' }));
    return out.sort((a, b) => a.t - b.t);
  }

  // ------------------------------------------------------------ Rendu des écrans
  let lastDesk = '', lastMob = '';
  const born = {};
  const FOCUS = TUTO.focus;
  function focusAt(t) {
    const zone = TUTO.zoneOf;
    const order = SEG.map((s) => ({ t: s.start - 0.2, z: zone(s.id) }));
    const ev = EVENTS.find((e) => e.chime);
    // Après l'envoi, la caméra recule (plan large, ou la zone choisie par le tutoriel).
    if (ev) order.push({ t: ev.t + 0.5, z: TUTO.zoneAfterChime ?? 'plein' });
    order.sort((a, b) => a.t - b.t);
    let from = FOCUS.plein, to = FOCUS.plein, k = 1;
    for (const o of order) {
      if (o.t > t) break;
      from = to === FOCUS[o.z] ? from : to; to = FOCUS[o.z];
      k = smooth(span(o.t, o.t + 0.7, t));
    }
    const r = { x: mix(from.x, to.x, k), y: mix(from.y, to.y, k), w: mix(from.w, to.w, k), h: mix(from.h, to.h, k) };
    const z = Math.min(960 / r.w, 600 / r.h);
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    const tx = Math.min(0, Math.max(960 - 1280 * z, 480 - cx * z));
    const ty = Math.min(0, Math.max(600 - 800 * z, 300 - cy * z));
    return `translate(${tx}px, ${ty}px) scale(${z})`;
  }

  function paint(s, t) {
    css($('desk'), { transform: focusAt(t) });
    const d = TUTO.deskHTML(s), m = TUTO.mobHTML(s);
    if (d !== lastDesk) { $('desk').innerHTML = d; lastDesk = d; }
    if (m !== lastMob) { $('mob').innerHTML = m; lastMob = m; }
    for (const el of document.querySelectorAll('[data-born],[data-pop]')) {
      const key = el.dataset.born || el.dataset.pop;
      born[key] ??= t;
      const a = t - born[key];
      if (el.dataset.born) css(el, { opacity: String(arrive(span(0, 0.35, a))), transform: `translateY(${(1 - arrive(span(0, 0.4, a))) * 14}px)` });
      else css(el, { display: 'inline-block', transform: `scale(${a < 0.45 ? mix(1.5, 1, back(span(0, 0.45, a))) : 1})` });
    }
    TUTO.afterPaint?.(s, t);
    const sh = document.querySelector('[data-sheet]');
    if (sh) { born.sheet ??= t; css(sh, { transform: `translateY(${(1 - arrive(span(0, 0.4, t - born.sheet))) * 100}%)` }); } else delete born.sheet;
  }

  function toast(s, t) {
    document.querySelectorAll('.toast').forEach((n) => n.remove());
    if (!s.toast || !TUTO.toast) return;
    const ev = EVENTS.find((e) => e.chime);
    const a = back(span(ev.t + 0.05, ev.t + 0.45, t));
    // `toastOn` : les écrans qui affichent la confirmation (les deux par défaut).
    const on = TUTO.toastOn ?? ['d', 'm'];
    for (const [root, w, left, dev] of [[$('desk'), 470, '400px', 'd'], [$('mob'), 350, '20px', 'm']]) {
      if (!on.includes(dev)) continue;
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = `<span class="ic">✓</span><span>${TUTO.toast}</span>`;
      // `toastAt.d` / `toastAt.m` : une autre place que le bas de l'écran.
      const place = TUTO.toastAt?.[dev] ?? { left, bottom: '28px' };
      css(el, { width: `${w}px`, ...place, opacity: String(span(ev.t + 0.05, ev.t + 0.2, t)), transform: `translateY(${(1 - a) * 30}px) scale(${mix(0.9, 1, a)})` });
      root.appendChild(el);
    }
  }

  // ------------------------------------------------------------ Gestes
  /** Rectangle d'un élément `data-t`, en coordonnées de la scène. */
  function rectOf(root, key) {
    const el = root.querySelector(`[data-t="${key}"]`);
    return el ? el.getBoundingClientRect() : null;
  }
  /** Le même rectangle, en coordonnées de l'écran de l'appareil (pour le projecteur). */
  function inScreen(screen, r, scale) {
    const c = screen.getBoundingClientRect();
    return { x: (r.left - c.left) / scale, y: (r.top - c.top) / scale, w: r.width / scale, h: r.height / scale };
  }

  /** Dernière position touchée par appareil : le geste suivant repart de là. */
  const lastTouch = { d: null, m: null };
  function gestures(t) {
    // Les gestes vivent de la première étape au dernier geste (plus son écho).
    const firstStep = SEG.find((x) => x.etape);
    const lastGesture = EVENTS.filter((e) => e.d || e.m).at(-1);
    const live = SEG.length && t > firstStep.start - 0.5 && t < lastGesture.t + (lastGesture.hold ?? 0) + 0.7;
    let tipShown = false;
    for (const dev of ['d', 'm']) {
      const root = dev === 'd' ? $('desk') : $('mob');
      const screen = dev === 'd' ? $('lscreen') : $('pscreen');
      // Échelle réelle de l'écran à l'image (appareil agrandi ou réduit).
      const scale = screen.getBoundingClientRect().width / (dev === 'd' ? 960 : 390);
      const evs = EVENTS.filter((e) => e[dev]);
      // `hold` : un regard reste allumé plus longtemps qu'un toucher.
      const next = evs.find((e) => e.t + (e.hold ?? 0) >= t - 0.5);
      const hold = next?.hold ?? 0;
      const prev = next ? [...evs].reverse().find((e) => e.t < next.t && !e.look) : null;
      const pointer = dev === 'd' ? $('cursor') : $('finger');
      const spot = dev === 'd' ? $('spot-d') : $('spot-m');
      const rip = $(dev === 'd' ? 'rip-desk' : 'rip-mob');
      const r = next && live ? rectOf(root, next[dev]) : null;
      if (!r) { css(pointer, { opacity: '0' }); css(spot, { opacity: '0' }); css(rip, { opacity: '0' }); continue; }
      const to = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      const pr = prev ? rectOf(root, prev[dev]) : null;
      // L'élément touché avant a pu disparaître (une feuille l'a recouvert) :
      // on repart alors du dernier endroit touché, pas d'un point arbitraire.
      const from = pr ? { x: pr.left + pr.width / 2, y: pr.top + pr.height / 2 } : (lastTouch[dev] ?? { x: to.x + 140, y: to.y + 200 });
      if (t >= next.t - 0.1 && !next.look) lastTouch[dev] = to;
      const k = smooth(span(next.t - 0.7, next.t - 0.08, t));
      const x = mix(from.x, to.x, k), y = mix(from.y, to.y, k);
      const press = t >= next.t - 0.08 && t <= next.t + 0.12;
      // Un appareil qui n'a encore rien touché garde son pointeur caché
      // jusqu'à l'approche de son premier geste (l'autre écran travaille).
      const idle = !pr && !lastTouch[dev] ? span(next.t - 1.4, next.t - 0.8, t) : 1;
      const appear = span(firstStep.start - 0.5, firstStep.start - 0.1, t) * idle;
      if (next.look) css(pointer, { opacity: '0' });
      else if (dev === 'd') css(pointer, { opacity: String(appear), left: `${x - 5}px`, top: `${y - 3}px`, transform: `scale(${press ? 0.82 : 1})` });
      else css(pointer, { opacity: String(appear), left: `${x}px`, top: `${y}px`, transform: `scale(${press ? 0.78 : 1})` });
      // Projecteur : s'allume avant le geste, s'éteint juste après.
      const sv = span(next.t - 0.75, next.t - 0.35, t) * (1 - span(next.t + 0.25 + hold, next.t + 0.5 + hold, t));
      const box = inScreen(screen, r, scale);
      css(spot, { opacity: String(sv), left: `${box.x - 8}px`, top: `${box.y - 8}px`, width: `${box.w + 16}px`, height: `${box.h + 16}px` });
      const rp = span(next.t, next.t + 0.5, t);
      css(rip, { opacity: String(rp > 0 && rp < 1 && !next.look ? 1 - rp : 0), left: `${to.x}px`, top: `${to.y}px`, transform: `scale(${0.4 + rp * 1.6})` });
      // La bulle : sur le téléphone (premier plan), ou sur l'ordinateur pour ses gestes à lui.
      // La bulle accompagne le téléphone ; un geste fait sur l'ordinateur seul a la sienne.
      const tipEv = next.tip && (dev === 'm' || !next.m) ? next : null;
      if (tipEv && tipEv.tip && !tipShown) {
        tipShown = true;
        const tv = back(span(next.t - 0.8, next.t - 0.45, t)) * (1 - leave(span(next.t + 0.3 + hold, next.t + 0.5 + hold, t)));
        const step = SEG.find((sg) => next.t >= sg.start - 0.1 && next.t <= sg.end + 0.5)?.etape ?? '';
        $('tip-n').textContent = step;
        $('tip-t').textContent = tipEv.tip;
        const tw = $('tip').offsetWidth, th = $('tip').offsetHeight;
        const below = r.top - th - 26 < (dev === 'm' ? (V ? 860 : 200) : (V ? 330 : 230));
        let left = to.x - tw / 2;
        left = Math.max(24, Math.min(left, window.innerWidth - tw - 24));
        $('tip').classList.toggle('below', below);
        $('tip').style.setProperty('--arrow', `${to.x - left}px`);
        css($('tip'), { opacity: String(clamp(tv)), left: `${left}px`, top: `${below ? r.bottom + 24 : r.top - th - 24}px`, transform: `scale(${mix(0.7, 1, clamp(tv))})` });
      }
    }
    if (!tipShown) css($('tip'), { opacity: '0' });
  }

  // ------------------------------------------------------------ Habillage
  function chrome(t) {
    const cur = [...SEG].reverse().find((s) => t >= s.start - 0.15) || SEG[0];
    if (!cur) return;
    const first = SEG[0], intro = seg('intro'), recap = seg('recap'), fin = seg('fin');

    // Titre de l'étape.
    $('title').textContent = cur.titre;
    const e = arrive(span(cur.start - 0.15, cur.start + 0.35, t));
    css($('title'), { opacity: String(e), transform: `translateY(${(1 - e) * 22}px)` });

    // Feuille de route : apparaît avec l'annonce des quatre étapes, une pastille après l'autre.
    const roadIn = intro ? intro.start + (intro.end - intro.start) * 0.45 : 0;
    const curStep = cur.etape ?? (t >= (recap?.start ?? Infinity) ? 5 : 0);
    [...$('road').children].forEach((pill, i) => {
      const n = i + 1;
      const a = back(span(roadIn + i * 0.14, roadIn + i * 0.14 + 0.4, t));
      pill.classList.toggle('on', curStep === n);
      pill.classList.toggle('done', curStep > n);
      pill.querySelector('.n').textContent = curStep > n ? '✓' : String(n);
      const pulse = curStep === n ? 1 + 0.06 * Math.max(0, 1 - (t - (SEG.find((s) => s.etape === n)?.start ?? 0)) / 0.5) : 1;
      css(pill, { opacity: String(clamp(a)), transform: `scale(${mix(0.6, 1, a) * pulse})` });
    });

    // Accroche : le bon papier, puis il se froisse et tombe.
    const hookOut = smooth(span(intro.start - 0.2, intro.start + 0.4, t));
    css($('hook'), { opacity: String(1 - hookOut) });
    const sIn = back(span(first.start, first.start + 0.6, t));
    const crumple = span(at('probleme', 0.66), at('probleme', 0.95), t);
    css($('slip'), { opacity: String(span(first.start, first.start + 0.2, t) * (1 - crumple * 0.9)),
      transform: `translateY(${(1 - sIn) * -200 + crumple * crumple * 900}px) rotate(${-6 + (1 - sIn) * 20 + crumple * 70}deg) scale(${mix(1.1, 1, sIn) * mix(1, 0.45, crumple)})`,
      filter: crumple > 0.05 ? `blur(${crumple * 6}px)` : 'none' });
    const ring = span(first.start, first.start + 0.4, t) * (1 - span(at('probleme', 0.5), at('probleme', 0.7), t));
    css($('hook-ring'), { opacity: String(ring), transform: `rotate(${Math.sin(t * 40) * 8 * (t < at('probleme', 0.4) ? 1 : 0)}deg)` });
    [...$('hook-ring').querySelectorAll('i')].forEach((c, i) => { const k = ((t * 1.4 + i / 2) % 1); css(c, { transform: `scale(${1 + k * 0.8})`, opacity: String(1 - k) }); });
    const lost = arrive(span(at('probleme', 0.62), at('probleme', 0.85), t));
    css($('lost'), { opacity: String(lost), transform: `translateY(${(1 - lost) * 30}px)` });

    // Appareils : arrivent avec l'introduction, s'effacent au résumé.
    const inn = arrive(span(intro.start, intro.start + 0.9, t));
    const toRecap = recap ? smooth(span(recap.start - 0.2, recap.start + 0.4, t)) : 0;
    const out = smooth(span(fin.start - 0.2, fin.start + 0.4, t));
    const devOp = inn * (1 - toRecap * 0.75) * (1 - out);
    for (const id of ['laptop', 'phone', 'lbl-pc', 'lbl-tel']) css($(id), { opacity: String(devOp) });
    const blur = toRecap * 6;
    css($('laptop'), { left: `${L.laptop.x}px`, top: `${L.laptop.y}px`, transform: `translateY(${(1 - inn) * 80}px) scale(${L.laptop.s})`, filter: blur > 0.3 ? `blur(${blur}px)` : 'none' });
    css($('phone'), { left: `${L.phone.x}px`, top: `${L.phone.y}px`, transform: `translateY(${(1 - inn) * 140}px) scale(${L.phone.s})`, filter: blur > 0.3 ? `blur(${blur}px)` : 'none' });
    css($('head'), { opacity: String(span(first.start, first.start + 0.4, t) * (1 - out)) });

    // Grand chiffre au début de chaque étape.
    let bn = 0, bnum = '';
    for (const s of stepStarts()) {
      const a = span(s.start - 0.7, s.start + 0.25, t);
      if (a > 0 && a < 1) { bn = a; bnum = String(s.etape); }
    }
    $('bignum-b').textContent = bnum;
    const bIn = back(span(0, 0.45, bn)), bOut = leave(span(0.7, 1, bn));
    css($('bignum'), { opacity: String(bn > 0 ? clamp(span(0, 0.15, bn)) * (1 - bOut) : 0), transform: `translateY(-50%) scale(${mix(0.5, 1, bIn) + bOut * 0.3})` });
    css($('dim'), { opacity: String(bn > 0 ? 0.85 * Math.sin(Math.PI * bn) : 0) });

    // Récapitulatif : la liste se coche au rythme de la voix.
    if (recap) {
      const ra = back(span(recap.start - 0.1, recap.start + 0.5, t)) * (1 - smooth(span(fin.start - 0.2, fin.start + 0.3, t)));
      css($('recap'), { opacity: String(clamp(ra * 1.2)), transform: `translate(-50%, -50%) scale(${mix(0.85, 1, clamp(ra))})` });
      $('recap').querySelectorAll('[data-ck]').forEach((ck, i) => {
        const on = t >= at('recap', TUTO.recapAt[i]);
        ck.classList.toggle('on', on);
        ck.textContent = on ? '✓' : String(i + 1);
        const p = span(at('recap', TUTO.recapAt[i]), at('recap', TUTO.recapAt[i]) + 0.35, t);
        css(ck, { transform: `scale(${on ? mix(1.4, 1, back(p)) : 1})` });
      });
    }

    // Carte finale.
    const ec = arrive(span(fin.start + 0.1, fin.start + 0.9, t));
    css($('end'), { opacity: String(ec), transform: `scale(${mix(0.92, 1, ec)})` });
    const of = back(span(fin.start + 0.7, fin.start + 1.2, t));
    css($('end').querySelector('.of'), { transform: `scale(${mix(0.6, 1, of)})`, opacity: String(clamp(of)) });

    // Sous-titres : les mots s'allument au fil de la voix.
    const say = SEG.find((s) => t >= s.start - 0.1 && t <= s.end + GAP * 0.8);
    if (!say || (say.id === 'fin' && t > say.end)) { $('subs').innerHTML = ''; return; }
    const words = say.texte.split(' ');
    const weights = words.map((w) => w.length + 2);
    const total = weights.reduce((a, b) => a + b, 0);
    const p = span(say.start, say.end - 0.15, t) * total;
    let acc = 0;
    const html = words.map((w, i) => {
      const startW = acc; acc += weights[i];
      const cls = p >= acc ? 'said' : p >= startW ? 'now' : '';
      return `<span class="w ${cls}">${w}</span>`;
    }).join(' ');
    $('subs').innerHTML = `<span class="box">${html}</span>`;
    css($('subs'), { bottom: V ? (say.id === 'recap' ? '250px' : '30px') : '26px' });
  }

  window.render = (t) => {
    if (!SEG.length) return;
    const s = stateAt(t);
    paint(s, t);
    toast(s, t);
    chrome(t);
    gestures(t);
  };
</script>
</body>
</html>
