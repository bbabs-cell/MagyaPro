  <script>
    (function () {
      var DURATION = 6;
      var $ = function (id) {
        return document.getElementById(id);
      };
      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–0.8s): kicker lands; phone is already in place (arrives with the push-slide)
      tl.fromTo(
        $("marche04-kicker"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.12,
      );

      // Scene 2 (0.8–4.0s): rows fill in rank order — name fades in, bar grows left→right, count ticks
      var rows = $("marche04-list").querySelectorAll('.marche04-row');
      var FILL = 0.9;
      var STEP = 0.75;
      for (var i = 0; i < rows.length; i++) {
        (function (row, at) {
          var name = row.querySelector('.marche04-name');
          var skel = row.querySelector('.marche04-skel');
          var count = row.querySelector('.marche04-count');
          var bar = row.querySelector('.marche04-bar');
          var target = parseInt(row.getAttribute("data-count"), 10);
          var pct = parseFloat(row.getAttribute("data-pct"));
          var proxy = { v: 0 };

          tl.fromTo(skel, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power1.out" }, at);
          tl.fromTo(
            name,
            { opacity: 0, x: -10 },
            { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" },
            at,
          );
          tl.fromTo(count, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, at);
          tl.fromTo(bar, { scaleX: 0 }, { scaleX: pct, duration: FILL, ease: "power2.out" }, at);
          tl.fromTo(
            proxy,
            { v: 0 },
            {
              v: target,
              duration: FILL,
              ease: "power2.out",
              onUpdate: function () {
                count.textContent = String(Math.round(proxy.v));
              },
            },
            at,
          );
        })(rows[i], 0.8 + i * STEP);
      }

      // Scene 3 (4.0–6.0s): caption fades up above the phone, under the kicker; braise marker sweep on the top row; hold
      tl.fromTo(
        $("marche04-caption"),
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        4.0,
      );
      tl.fromTo($("marche04-hl"), { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.out" }, 4.3);

      // pad to the fixed frame length
      tl.to({}, { duration: Math.max(0, DURATION - tl.duration()) }, tl.duration());

      window.__timelines = window.__timelines || {};
      window.__timelines["04-marche"] = tl;
    })();
  </script>
