<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: "Bricolage Grotesque";
      font-weight: 200 800;
      font-style: normal;
      src: url("assets/fonts/BricolageGrotesque-Variable.woff2") format("woff2");
    }

    #root {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      z-index: 2;
      container-type: size;
    }

    /* Full-bleed grade layer over the hoisted footage (alpha only, no blend modes,
       so it reads the same whether or not the frame forms its own stacking context). */
    .f01-grade {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 70% at 78% 18%, rgba(255, 170, 90, 0.16) 0%, rgba(255, 140, 60, 0) 60%),
        linear-gradient(180deg, rgba(255, 150, 70, 0.07) 0%, rgba(120, 50, 10, 0.06) 100%);
    }

    .f01-glow {
      position: absolute;
      left: -10%;
      top: 4%;
      width: 80%;
      height: 46%;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(255, 176, 96, 0.22), rgba(255, 176, 96, 0));
    }

    .f01-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        115% 80% at 50% 42%,
        rgba(11, 23, 48, 0) 52%,
        rgba(11, 23, 48, 0.42) 82%,
        rgba(6, 12, 26, 0.72) 100%
      );
    }

    .f01-lower {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 52%;
      background: linear-gradient(
        180deg,
        rgba(11, 23, 48, 0) 0%,
        rgba(11, 23, 48, 0.38) 34%,
        rgba(11, 23, 48, 0.66) 62%,
        rgba(8, 16, 34, 0.78) 100%
      );
    }

    .f01-grain {
      position: absolute;
      left: -60px;
      top: -60px;
      width: calc(100% + 120px);
      height: calc(100% + 120px);
      opacity: 0.11;
    }
    .f01-grain svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .f01-type {
      position: absolute;
      left: 5.5cqw;
      top: 1130px;
      width: 89cqw;
    }

    .f01-rule {
      width: 36px;
      height: 2px;
      background: #ff5e2e;
      margin-bottom: 34px;
      transform-origin: 0 50%;
    }

    .f01-line {
      display: block;
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 800;
      font-size: 8.4cqw;
      line-height: 1.02;
      letter-spacing: -0.03em;
      color: #fbf8f2;
      text-transform: lowercase;
      white-space: pre;
      min-height: 1.02em;
    }

    .f01-hot {
      color: #ff5e2e;
    }

    .f01-caret {
      display: inline-block;
      width: 0.11em;
      height: 0.86em;
      margin-left: 0.06em;
      vertical-align: -0.1em;
      background: #ff5e2e;
      opacity: 0;
    }
  </style>

  <div data-hf-id="hf-vi6n" id="root" data-composition-id="01-combien" data-width="1080" data-height="1920" data-duration="7.4">
    <!-- Footage: hoisted to the host root by assemble-index (full-bleed, cover-cropped 9:16). -->
    <!-- approved frame video hoisted by assemble-index -->

    <!-- Warm grade + vignette + lower-third darkening + grain (full duration) -->
    <div data-hf-id="hf-q5g1" id="f01-look" class="clip" data-start="0" data-duration="7.4" data-track-index="1">
      <div data-hf-id="hf-3lnp" class="f01-grade"></div>
      <div data-hf-id="hf-ovri" class="f01-glow" id="f01-glow"></div>
      <div data-hf-id="hf-j6au" class="f01-vignette"></div>
      <div data-hf-id="hf-79i0" class="f01-lower" id="f01-lower"></div>
      <div data-hf-id="hf-32t8" class="f01-grain" id="f01-grain">
        <svg data-hf-id="hf-ha1h" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1100" preserveAspectRatio="none">
          <filter data-hf-id="hf-5dq6" id="f01-noise" x="0" y="0" width="100%" height="100%">
            <feturbulence data-hf-id="hf-g15n" id="f01-turb" type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" stitchTiles="stitch" />
            <fecolormatrix data-hf-id="hf-skw8" type="saturate" values="0" />
          </filter>
          <rect data-hf-id="hf-ipj5" width="600" height="1100" filter="url(#f01-noise)" />
        </svg>
      </div>
    </div>

    <!-- Typed question, lower third, left-aligned at the pad -->
    <div data-hf-id="hf-ei4p" id="f01-typeclip" class="clip" data-start="0" data-duration="7.4" data-track-index="2">
      <div data-hf-id="hf-2swg" class="f01-type">
        <div data-hf-id="hf-lkea" class="f01-rule" id="f01-rule"></div>
        <span data-hf-id="hf-y6a7" class="f01-line"><span data-hf-id="hf-7i2v" id="f01-l1"></span><span data-hf-id="hf-unaw" class="f01-caret" id="f01-c1"></span></span>
        <span data-hf-id="hf-ndrj" class="f01-line"><span data-hf-id="hf-fbmr" class="f01-hot" id="f01-l2a"></span><span data-hf-id="hf-g0xy" id="f01-l2b"></span><span data-hf-id="hf-5isj" class="f01-caret" id="f01-c2"></span></span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const DURATION = 7;
      const tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0–3.4s): footage breathes; lower-third gradient rises; warm glow drifts ----
      tl.fromTo("#f01-lower", { opacity: 0, y: 140 }, { opacity: 1, y: 0, duration: 1.6, ease: "power2.out" }, 0.2);
      tl.fromTo("#f01-glow", { x: 0, opacity: 0.6 }, { x: 120, opacity: 1, duration: DURATION, ease: "sine.inOut" }, 0);

      // Film grain: deterministic stepped jitter (12 steps/s), pure function of time.
      const grainEl = document.getElementById("f01-grain");
      const turbEl = document.getElementById("f01-turb");
      const grain = { t: 0 };
      tl.to(
        grain,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: () => {
            const step = Math.floor(grain.t * 12);
            const gx = ((step * 37) % 97) - 48;
            const gy = ((step * 61) % 89) - 44;
            grainEl.style.transform = "translate(" + gx + "px," + gy + "px)";
            turbEl.setAttribute("seed", String(3 + (step % 8)));
          },
        },
        0,
      );

      // ---- Scene 2 (3.4–6.0s): discrete type-on with braise caret ----
      // Each entry: { t, l1, l2a (aujourd'hui, braise), l2b, line (which caret is active), tall }
      const SEQUENCE = [
        { t: 0.0, l1: "", l2a: "", l2b: "", line: 1 },
        { t: 3.52, l1: "c", l2a: "", l2b: "", line: 1 },
        { t: 3.6, l1: "com", l2a: "", l2b: "", line: 1 },
        { t: 3.7, l1: "combi", l2a: "", l2b: "", line: 1 },
        { t: 3.8, l1: "combien", l2a: "", l2b: "", line: 1 },
        { t: 4.12, l1: "combien tu", l2a: "", l2b: "", line: 1 },
        { t: 4.38, l1: "combien tu as", l2a: "", l2b: "", line: 1 },
        { t: 4.64, l1: "combien tu as ve", l2a: "", l2b: "", line: 1 },
        { t: 4.76, l1: "combien tu as vendu", l2a: "", l2b: "", line: 1 },
        // thinking beat, then the line breaks and "aujourd'hui" lands last, in braise
        { t: 5.2, l1: "combien tu as vendu", l2a: "au", l2b: "", line: 2, hot: true },
        { t: 5.3, l1: "combien tu as vendu", l2a: "aujou", l2b: "", line: 2, hot: true },
        { t: 5.42, l1: "combien tu as vendu", l2a: "aujourd", l2b: "", line: 2, hot: true },
        { t: 5.56, l1: "combien tu as vendu", l2a: "aujourd'hui", l2b: "", line: 2, hot: true },
        { t: 5.86, l1: "combien tu as vendu", l2a: "aujourd'hui", l2b: " ?", line: 2 },
      ];
      const CHANGE_TIMES = SEQUENCE.filter((e, i) => i > 0).map((e) => e.t);
      const TYPING_GRACE = 0.2;
      const CARET_ON = 3.4; // caret appears as he meets the lens
      const BLINK_END = 6.6; // Scene 3: two blinks after the line completes, then the caret stops
      const BLINK_PERIOD = 0.4;

      function entryAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i];
        }
        return SEQUENCE[0];
      }

      const l1 = document.getElementById("f01-l1");
      const l2a = document.getElementById("f01-l2a");
      const l2b = document.getElementById("f01-l2b");
      const c1 = document.getElementById("f01-c1");
      const c2 = document.getElementById("f01-c2");

      function caretVisible(time) {
        if (time < CARET_ON || time >= BLINK_END) return false;
        const typing = CHANGE_TIMES.some((ct) => ct <= time && time - ct < TYPING_GRACE);
        if (typing) return true;
        // Deterministic square-wave blink, phase anchored so it is "on" at 6.0s (Scene 3 start)
        return Math.sin(((time - 6.0) / BLINK_PERIOD) * Math.PI * 2 + Math.PI / 2) > 0;
      }

      const driver = { t: 0 };
      function render(time) {
        const e = entryAt(time);
        l1.textContent = e.l1;
        l2a.textContent = e.l2a;
        l2b.textContent = e.l2b;
        const vis = caretVisible(time) ? "1" : "0";
        c1.style.opacity = e.line === 1 ? vis : "0";
        c2.style.opacity = e.line === 2 ? vis : "0";
        // context-sensitive caret: slightly taller while typing the braise keyword
        c2.style.height = e.hot ? "0.98em" : "0.86em";
      }
      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: () => render(driver.t),
        },
        0,
      );
      render(0);

      // Braise rule stub draws in just before the first keystroke
      tl.fromTo("#f01-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 3.4);

      // ---- Scene 3 (6.0–7.0s): line complete, caret blinks twice then stops; hold on his gaze ----
      // (handled by caretVisible; no exits — the root transition owns the cut)

      window.__timelines["01-combien"] = tl;
    })();
  </script>
</template>
