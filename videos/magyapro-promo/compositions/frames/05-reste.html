  <div

      <div class="05-reste-cam-inner" id="f05-reste-cam-inner">
        <div class="05-reste-phone">
          <div class="05-reste-screen">
            <div class="05-reste-viewport">

              <svg class="05-reste-rule" viewBox="0 0 350 6" xmlns="http://www.w3.org/2000/svg">

                <div class="05-reste-count-wrap">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      "use strict";
      var $ = function (id) {
        return document.getElementById(id);
      };

      var camOuter = $("f05-reste-cam-outer");
      var camInner = $("f05-reste-cam-inner");
      var row2 = $("f05-reste-row-2");
      var upper = $("f05-reste-upper");
      var rulePath = $("f05-reste-rule-path");
      var card = $("f05-reste-card");
      var cardLabel = $("f05-reste-card-label");
      var count = $("f05-reste-count");
      var countNum = $("f05-reste-count-num");
      var suffix = $("f05-reste-count-suffix");
      var kicker = $("f05-reste-kicker");
      var caption = $("f05-reste-caption");

      // French thousands grouping, deterministic (no locale dependency).
      function fmt(n) {
        var s = String(Math.round(n));
        return s.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
      }

      // svg-path-draw setup: the rule is a straight 347-unit line; measure when possible.
      var RULE_LEN = 347;
      try {
        var measured = rulePath.getTotalLength();
        if (measured > 0) RULE_LEN = measured;
      } catch (e) {}
      rulePath.style.strokeDasharray = RULE_LEN * 1.05 + "";
      rulePath.style.strokeDashoffset = RULE_LEN * 1.05 + "";

      // coordinate-target-zoom: the result number's center is laid out at canvas
      // (540, 985) by fixed geometry (screen origin 230,303 + 429 logical px × 1.58974).
      // Canvas center is (540, 960) → offset (0, +25) → counter-translate T = -offset.
      var TARGET_OFFSET_X = 0;
      var TARGET_OFFSET_Y = 25;
      var ZOOM_SCALE = 1.8; // number ≈ 82% of frame width at peak (headroom ≤ 88%)
      var ZOOM_AT = 4.45;
      var ZOOM_DUR = 1.0;

      var COUNT_AT = 2.85;
      var COUNT_DUR = 1.7;
      var TARGET_VALUE = 275500;
      var START_SCALE = 0.5;

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–1.2): kicker settles in; phone + « Chiffre d'affaires » already present.
      tl.fromTo(kicker, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.1);

      // Scene 2 (1.2–2.6): « − Dépenses » slides in, then the rule draws across.
      tl.fromTo(row2, { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 1.2);
      tl.to(rulePath, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 1.8);

      // Scene 3 (2.6–5.0): result card + « Il vous reste », count-up with dynamic scale, camera punch.
      tl.fromTo(card, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.6);
      tl.fromTo(cardLabel, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.7);

      var state = { v: 0 };
      countNum.textContent = fmt(0);
      tl.to(
        state,
        {
          v: TARGET_VALUE,
          duration: COUNT_DUR,
          ease: "power3.out",
          onUpdate: function () {
            countNum.textContent = fmt(state.v);
          },
        },
        COUNT_AT,
      );
      tl.fromTo(count, { scale: START_SCALE }, { scale: 1, duration: COUNT_DUR, ease: "power3.out" }, COUNT_AT);
      tl.fromTo(
        suffix,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" },
        COUNT_AT + COUNT_DUR - 0.15,
      );

      // The one camera move: scale + counter-translate share position, duration and ease.
      tl.fromTo(camOuter, { scale: 1 }, { scale: ZOOM_SCALE, duration: ZOOM_DUR, ease: "expo.out" }, ZOOM_AT);
      tl.fromTo(
        camInner,
        { x: 0, y: 0 },
        { x: -TARGET_OFFSET_X, y: -TARGET_OFFSET_Y, duration: ZOOM_DUR, ease: "expo.out" },
        ZOOM_AT,
      );

      // Focus falloff while the camera punches: the upper ledger recedes and the
      // kicker flips to ink so it stays legible over the enlarged light screen.
      tl.fromTo(upper, { opacity: 1 }, { opacity: 0.16, duration: 0.6, ease: "power2.out" }, ZOOM_AT);
      tl.fromTo(kicker, { color: "#b3a894" }, { color: "rgba(33, 29, 22, 0.62)", duration: 0.5, ease: "power2.out" }, ZOOM_AT + 0.1);

      // Scene 4 (5.0–7.0): « vraiment. » lands below the number, then dead-still hold.
      tl.fromTo(caption, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 5.05);

      // pad to full duration (hold)
      tl.to({}, { duration: 7 - tl.duration() });

      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["05-reste"] = tl;
    })();
  </script>
