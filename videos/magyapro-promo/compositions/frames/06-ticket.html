  <script>
    (function () {
      const FRAME = "06-ticket";
      const TOTAL = 7;
      const root = document.querySelector('[data-composition-id="' + FRAME + '"]');
      const $ = (sel) => root.querySelector(sel);

      const tl = gsap.timeline({ paused: true });

      // ── Discrete print states (discrete-text-sequence): header text swaps whole
      // states at thresholds; every other printed part snaps on instantly at its t.
      const HEAD_SEQUENCE = [
        { t: 0.0, text: "" },
        { t: 0.42, text: "MAGYAPRO" },
        { t: 0.62, text: "MAGYAPRO · REÇU" },
      ];
      function headAt(time) {
        for (let i = HEAD_SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= HEAD_SEQUENCE[i].t) return HEAD_SEQUENCE[i].text;
        }
        return "";
      }
      const headEl = $('[data-print="head"]');
      const parts = Array.prototype.slice
        .call(root.querySelectorAll("[data-print]"))
        .filter((el) => el !== headEl)
        .map((el) => ({ el: el, t: parseFloat(el.getAttribute("data-print")) }));

      function render(time) {
        headEl.textContent = headAt(time);
        for (let i = 0; i < parts.length; i++) {
          parts[i].el.style.visibility = time >= parts[i].t ? "visible" : "hidden";
        }
      }
      render(0);

      const driver = { t: 0 };
      tl.fromTo(
        driver,
        { t: 0 },
        {
          t: TOTAL,
          duration: TOTAL,
          ease: "none",
          onUpdate: () => render(driver.t),
        },
        0,
      );

      // ── Scene 1: slot + kicker, header feeds out
      const slot = $(".f06-ticket-slot");
      tl.fromTo(slot, { scaleX: 0.2, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0);
      tl.fromTo(
        $(".f06-ticket-kicker"),
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.1,
      );
      tl.fromTo($(".f06-ticket-stub"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.15);

      // ── Paper feed: a ground-colored cover slides down in stepped jolts,
      // revealing the ticket line by line beneath the slot (transform-only).
      const cover = $(".f06-ticket-cover");
      const FEED = [
        { t: 0.3, r: 152 }, // header
        { t: 1.0, r: 264 }, // IA payante
        { t: 2.1, r: 376 }, // carte bancaire
        { t: 3.2, r: 488 }, // coût à l'usage
        { t: 4.4, r: 552 }, // dashed rule
        { t: 4.75, r: 636 }, // réglé par :
        { t: 5.1, r: 732 }, // Wave · Orange Money
        { t: 5.45, r: 1026 }, // merci ! + stamp room + tear edge
      ];
      tl.fromTo(cover, { y: 0 }, { y: FEED[0].r, duration: 0.16, ease: "power2.out" }, FEED[0].t);
      for (let i = 1; i < FEED.length; i++) {
        tl.to(cover, { y: FEED[i].r, duration: 0.16, ease: "power2.out" }, FEED[i].t);
      }
      // the slot ticks with each feed step (mechanical jolt, then still)
      for (let i = 0; i < FEED.length; i++) {
        tl.fromTo(slot, { y: 0 }, { y: 3, duration: 0.05, ease: "power1.out" }, FEED[i].t);
        tl.to(slot, { y: 0, duration: 0.12, ease: "power2.out" }, FEED[i].t + 0.05);
      }

      // ── Scene 4: braise stamp thumps on (spring-pop-entrance, smooth settle)
      const stamp = $(".f06-ticket-stamp");
      tl.fromTo(
        stamp,
        { scale: 0, opacity: 0, rotation: -7 },
        { scale: 1, opacity: 0.94, rotation: -7, duration: 0.5, ease: "power3.out" },
        5.85,
      );
      // ticket answers the thump with a small press, then rests
      const ticket = $(".f06-ticket-ticket");
      tl.fromTo(ticket, { y: 0 }, { y: 6, duration: 0.07, ease: "power1.out" }, 6.0);
      tl.to(ticket, { y: 0, duration: 0.25, ease: "power3.out" }, 6.07);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME] = tl;
    })();
  </script>
